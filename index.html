<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta
  name="viewport"
  content="width=device-width, initial-scale=1.0, viewport-fit=cover"
/>

<title>Live Puzzle — Hand Tracking</title>

<style>
  :root {
    --accent: #d9ff3a;
  }

  * {
    box-sizing: border-box;
  }

  html,
  body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: linear-gradient(
      135deg,
      #dff7ff 0%,
      #aee7f7 45%,
      #8bd3ec 100%
    );
    font-family:
      -apple-system,
      BlinkMacSystemFont,
      "Segoe UI",
      Roboto,
      sans-serif;
  }

  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
  }

  video {
    display: none;
  }

  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }

  #stage.puzzle-mode {
    background: linear-gradient(
      135deg,
      #dff7ff 0%,
      #b8ecfa 45%,
      #8bd3ec 100%
    );
  }

  /* =========================
     TOP BAR
  ========================= */

  .top-bar {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;

    padding:
      max(14px, env(safe-area-inset-top))
      16px
      10px;

    text-align: center;

    background:
      linear-gradient(
        to bottom,
        rgba(0, 0, 0, 0.55),
        transparent
      );

    z-index: 10;
    pointer-events: none;
  }

  .top-bar h1 {
    font-size: 0.95rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;

    color: #075985;

    margin: 0 0 3px;
  }

  .top-bar p {
    color: #164e63;
    font-size: 0.78rem;
    margin: 0 auto;
    max-width: 480px;
  }

  /* =========================
     TIMER
  ========================= */

  .timer {
    position: fixed;

    top:
      max(14px, env(safe-area-inset-top));

    right: 16px;

    z-index: 20;

    color: #075985;

    font-weight: 700;
    font-size: 1rem;

    background: rgba(255, 255, 255, 0.78);

    padding: 8px 14px;

    border-radius: 999px;

    display: none;

    letter-spacing: 0.05em;

    font-variant-numeric:
      tabular-nums;

    box-shadow:
      0 4px 16px
      rgba(0, 0, 0, 0.2);
  }

  /* =========================
     SCOREBOARD BUTTON
  ========================= */

  #scoreboardBtn {
    position: fixed;

    top:
      max(14px, env(safe-area-inset-top));

    left: 16px;

    z-index: 21;

    background: rgba(255, 255, 255, 0.82);

    color: #075985;

    border: none;

    padding: 9px 16px;

    border-radius: 999px;

    font-weight: 700;

    font-size: 0.85rem;

    cursor: pointer;

    box-shadow:
      0 4px 16px
      rgba(0, 0, 0, 0.2);
  }

  /* =========================
     BOTTOM CONTROLS
  ========================= */

  .bottom-bar {
    position: fixed;

    bottom:
      max(20px, env(safe-area-inset-bottom));

    left: 0;
    right: 0;

    display: flex;

    gap: 10px;

    justify-content: center;

    z-index: 10;
  }

  button {
    background: var(--accent);

    color: #111;

    border: none;

    padding: 13px 24px;

    border-radius: 999px;

    font-weight: 700;

    font-size: 0.9rem;

    cursor: pointer;

    letter-spacing: 0.02em;

    box-shadow:
      0 4px 16px
      rgba(0, 0, 0, 0.35);
  }

  button.secondary {
    background: rgba(0, 0, 0, 0.5);

    color: var(--accent);

    border:
      1.5px solid
      var(--accent);
  }

  button:disabled {
    opacity: 0.4;
    cursor: not-allowed;
  }

  /* =========================
     MODALS
  ========================= */

  .modal-overlay {
    position: fixed;

    inset: 0;

    background:
      rgba(0, 35, 55, 0.58);

    backdrop-filter: blur(7px);

    display: none;

    align-items: center;

    justify-content: center;

    z-index: 100;

    padding: 20px;
  }

  .modal {
    width: min(440px, 92vw);

    background: rgba(255, 255, 255, 0.96);

    border-radius: 25px;

    padding: 30px;

    text-align: center;

    box-shadow:
      0 20px 60px
      rgba(0, 40, 60, 0.35);
  }

  .modal h2 {
    margin:
      0 0 12px;

    color: #075985;

    font-size: 1.7rem;
  }

  .modal p {
    color: #164e63;

    line-height: 1.5;

    margin-bottom: 18px;
  }

  .modal input {
    width: 100%;

    padding: 13px 15px;

    border:
      2px solid
      #b8e7f5;

    border-radius: 13px;

    outline: none;

    font-size: 1rem;

    color: #075985;

    margin-bottom: 14px;
  }

  .modal input:focus {
    border-color: #5dbddd;
  }

  /* =========================
     SCOREBOARD
  ========================= */

  .scoreboard {
    max-height: 55vh;

    overflow-y: auto;

    margin:
      15px 0;
  }

  .score-row {
    display: grid;

    grid-template-columns:
      35px
      1fr
      75px
      85px;

    gap: 7px;

    align-items: center;

    background:
      rgba(220, 247, 255, 0.85);

    color: #075985;

    border-radius: 12px;

    padding: 10px 12px;

    margin-bottom: 7px;

    font-size: 0.85rem;

    text-align: left;
  }

  .score-row span:nth-child(1) {
    font-weight: 800;
  }

  .score-name {
    overflow: hidden;

    text-overflow: ellipsis;

    white-space: nowrap;
  }

  .score-time {
    font-weight: 700;

    text-align: center;
  }

  .score-date {
    font-size: 0.72rem;

    color: #4b7888;

    text-align: right;
  }

  .no-scores {
    color: #4b7888;

    padding: 20px;
  }

  /* =========================
     MOBILE
  ========================= */

  @media (max-width: 650px) {

    .score-row {
      grid-template-columns:
        30px
        1fr
        65px;
    }

    .score-date {
      display: none;
    }

    .bottom-bar {
      flex-wrap: wrap;

      padding:
        0 10px;
    }

    button {
      padding:
        11px 17px;

      font-size:
        0.82rem;
    }
  }
</style>
</head>

<body>

<div

  <div class="modal">

<!-- =========================================================
     MAIN SCRIPT
========================================================= -->

<script type="module">

import {
  HandLandmarker,
  FilesetResolver
}
from
"https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";


(function () {

  /* =========================================================
     ELEMENTS
  ========================================================= */

  const video =
    document.getElementById(
      "video"
    );

  const canvas =
    document.getElementById(
      "canvas"
    );

  const ctx =
    canvas.getContext("2d");

  const stage =
    document.getElementById(
      "stage"
    );

  const instructions =
    document.getElementById(
      "instructions"
    );

  const timerEl =
    document.getElementById(
      "timer"
    );

  const captureBtn =
    document.getElementById(
      "captureBtn"
    );

  const captureBtnWrap =
    document.getElementById(
      "captureBtnWrap"
    );

  const cropControls =
    document.getElementById(
      "cropControls"
    );

  const confirmCropBtn =
    document.getElementById(
      "confirmCropBtn"
    );

  const cancelCropBtn =
    document.getElementById(
      "cancelCropBtn"
    );

  const postControls =
    document.getElementById(
      "postControls"
    );

  const shuffleBtn =
    document.getElementById(
      "shuffleBtn"
    );

  const undoBtn =
    document.getElementById(
      "undoBtn"
    );

  const retakeBtn =
    document.getElementById(
      "retakeBtn"
    );

  const startModal =
    document.getElementById(
      "startModal"
    );

  const playerNameInput =
    document.getElementById(
      "playerNameInput"
    );

  const startGameBtn =
    document.getElementById(
      "startGameBtn"
    );

  const resultModal =
    document.getElementById(
      "resultModal"
    );

  const resultEmoji =
    document.getElementById(
      "resultEmoji"
    );

  const resultTitle =
    document.getElementById(
      "resultTitle"
    );

  const resultDetails =
    document.getElementById(
      "resultDetails"
    );

  const scoreboardBtn =
    document.getElementById(
      "scoreboardBtn"
    );

  const scoreboardModal =
    document.getElementById(
      "scoreboardModal"
    );

  const scoreboardList =
    document.getElementById(
      "scoreboardList"
    );

  const closeScoreboardBtn =
    document.getElementById(
      "closeScoreboardBtn"
    );


  /* =========================================================
     CONSTANTS
  ========================================================= */

  const GRID = 3;

  /*
    EXACTLY ONE MINUTE.
    No 3-minute timer anywhere.
  */

  const ROUND_TIME_MS =
    60 * 1000;

  /*
    Crop auto-frame timer.
    This is NOT the game timer.
  */

  const CROP_HOLD_MS =
    5000;

  const SCORE_KEY =
    "oceanJigsawScoreboard";


  /* =========================================================
     CANVAS SIZE
  ========================================================= */

  let CANVAS_W = 0;

  let CANVAS_H = 0;


  function resizeCanvas() {

    CANVAS_W =
      canvas.width =
        window.innerWidth;

    CANVAS_H =
      canvas.height =
        window.innerHeight;
  }


  resizeCanvas();


  /* =========================================================
     GAME STATE
  ========================================================= */

  /*
    preview
    crop
    puzzle
  */

  let phase =
    "preview";


  let tileCanvases =
    [];


  let order =
    [];


  let heldTile =
    null;


  let cursor = {
    x: 0,
    y: 0,
    visible: false
  };


  let prevPinching =
    false;


  let solvedShown =
    false;


  /* =========================================================
     TIMER STATE
  ========================================================= */

  let timerStart =
    0;

  let timerInterval =
    null;

  let roundStarted =
    false;

  let resultShown =
    false;


  /* =========================================================
     UNDO
  ========================================================= */

  let moveHistory =
    [];


  /* =========================================================
     CROP STATE
  ========================================================= */

  let crop = {
    x: 0,
    y: 0,
    w: 0,
    h: 0
  };


  let cropGrab =
    null;


  let twoHandTimerActive =
    false;


  let twoHandTimerStart =
    0;


  /* =========================================================
     HAND TRACKING STATE
  ========================================================= */

  let cachedHands =
    [];

  let handLandmarker =
    null;

  let modelReady =
    false;

  let detectBusy =
    false;

  let lastVideoTime =
    -1;

  let frameCount =
    0;


  /* =========================================================
     PLAYER
  ========================================================= */

  let playerName =
    "";


  /* =========================================================
     BUBBLES
  ========================================================= */

  const bubbles =
    [];


  function initBubbles() {

    bubbles.length = 0;

    const count =
      Math.min(
        28,
        Math.floor(
          Math.min(
            CANVAS_W,
            CANVAS_H
          ) / 28
        )
      );

    for (
      let i = 0;
      i < count;
      i++
    ) {

      bubbles.push({

        x:
          Math.random() *
          CANVAS_W,

        y:
          Math.random() *
          CANVAS_H,

        r:
          6 +
          Math.random() *
          22,

        speed:
          0.3 +
          Math.random() *
          0.9,

        wobble:
          Math.random() *
          Math.PI *
          2,

        wobbleSpeed:
          0.01 +
          Math.random() *
          0.03,

        alpha:
          0.12 +
          Math.random() *
          0.25

      });

    }
  }


  function drawBubbles() {

    for (
      const b of bubbles
    ) {

      b.y -= b.speed;

      b.wobble +=
        b.wobbleSpeed;

      const bx =
        b.x +
        Math.sin(
          b.wobble
        ) *
        14;

      if (
        b.y <
        -b.r * 2
      ) {

        b.y =
          CANVAS_H +
          b.r * 2;

        b.x =
          Math.random() *
          CANVAS_W;
      }

      ctx.beginPath();

      ctx.arc(
        bx,
        b.y,
        b.r,
        0,
        Math.PI * 2
      );

      ctx.fillStyle =
        `rgba(
          255,
          255,
          255,
          ${b.alpha * 0.55}
        )`;

      ctx.fill();

      ctx.strokeStyle =
        `rgba(
          255,
          255,
          255,
          ${Math.min(
            0.55,
            b.alpha * 1.4
          )}
        )`;

      ctx.lineWidth = 1.2;

      ctx.stroke();

    }
  }


  initBubbles();


  /* =========================================================
     VIDEO MAPPING
  ========================================================= */

  function getCoverTransform() {

    const vw =
      video.videoWidth ||
      640;

    const vh =
      video.videoHeight ||
      480;

    const scale =
      Math.max(
        CANVAS_W / vw,
        CANVAS_H / vh
      );

    const drawW =
      vw * scale;

    const drawH =
      vh * scale;

    return {

      vw,
      vh,
      scale,
      drawW,
      drawH,

      offsetX:
        (CANVAS_W -
          drawW) / 2,

      offsetY:
        (CANVAS_H -
          drawH) / 2
    };
  }


  /*
    IMPORTANT:

    The displayed webcam is mirrored.
    So we mirror the canvas image too.
  */

  function drawCoverVideo(
    targetCtx
  ) {

    const t =
      getCoverTransform();

    targetCtx.save();

    targetCtx.translate(
      CANVAS_W,
      0
    );

    targetCtx.scale(
      -1,
      1
    );

    targetCtx.drawImage(
      video,
      t.offsetX,
      t.offsetY,
      t.drawW,
      t.drawH
    );

    targetCtx.restore();
  }


  /*
    IMPORTANT:

    MediaPipe coordinates are NOT
    mirrored.

    The display IS mirrored.

    Therefore X becomes:
      1 - lm.x
  */

  function toCanvasPoint(
    lm
  ) {

    const t =
      getCoverTransform();

    return {

      x:
        t.offsetX +
        (1 - lm.x) *
        t.vw *
        t.scale,

      y:
        t.offsetY +
        lm.y *
        t.vh *
        t.scale

    };
  }


  function dist(
    a,
    b
  ) {

    return Math.hypot(
      a.x - b.x,
      a.y - b.y
    );
  }


  /* =========================================================
     PROCESS HAND
  ========================================================= */

  function processHand(
    landmarks
  ) {

    const thumbTip =
      toCanvasPoint(
        landmarks[4]
      );

    const indexTip =
      toCanvasPoint(
        landmarks[8]
      );

    const wrist =
      toCanvasPoint(
        landmarks[0]
      );

    const midMcp =
      toCanvasPoint(
        landmarks[9]
      );

    const handScale =
      Math.max(
        dist(
          wrist,
          midMcp
        ),
        20
      );


    /*
      Slightly more forgiving pinch
      detection.
    */

    const pinching =
      dist(
        thumbTip,
        indexTip
      ) <
      handScale * 0.60;


    return {

      landmarks,

      thumbTip,

      indexTip,

      wrist,

      midMcp,

      pinching,

      pinchPoint: {

        x:
          (
            thumbTip.x +
            indexTip.x
          ) / 2,

        y:
          (
            thumbTip.y +
            indexTip.y
          ) / 2

      }

    };
  }


  /* =========================================================
     CROP
  ========================================================= */

  function defaultCrop() {

    /*
      Start with a large square,
      but allow the user to change it.
    */

    const size =
      Math.min(
        CANVAS_W,
        CANVAS_H
      ) *
      0.82;

    crop = {

      x:
        (CANVAS_W -
          size) / 2,

      y:
        (CANVAS_H -
          size) / 2,

      w:
        size,

      h:
        size

    };
  }


  function clampCrop() {

    const min =
      Math.min(
        CANVAS_W,
        CANVAS_H
      ) *
      0.12;

    if (
      crop.w < min
    )
      crop.w = min;

    if (
      crop.h < min
    )
      crop.h = min;

    if (
      crop.w > CANVAS_W
    )
      crop.w = CANVAS_W;

    if (
      crop.h > CANVAS_H
    )
      crop.h = CANVAS_H;

    if (
      crop.x < 0
    )
      crop.x = 0;

    if (
      crop.y < 0
    )
      crop.y = 0;

    if (
      crop.x +
      crop.w >
      CANVAS_W
    ) {

      crop.x =
        CANVAS_W -
        crop.w;
    }

    if (
      crop.y +
      crop.h >
      CANVAS_H
    ) {

      crop.y =
        CANVAS_H -
        crop.h;
    }
  }


  function softClampCrop() {

    if (
      crop.x < 0
    ) {

      crop.w +=
        crop.x;

      crop.x = 0;
    }

    if (
      crop.y < 0
    ) {

      crop.h +=
        crop.y;

      crop.y = 0;
    }

    if (
      crop.x +
      crop.w >
      CANVAS_W
    ) {

      crop.w =
        CANVAS_W -
        crop.x;
    }

    if (
      crop.y +
      crop.h >
      CANVAS_H
    ) {

      crop.h =
        CANVAS_H -
        crop.y;
    }

    if (
      crop.w < 10
    )
      crop.w = 10;

    if (
      crop.h < 10
    )
      crop.h = 10;
  }


  /* =========================================================
     GRID
  ========================================================= */

  function cellRect(
    gridPos
  ) {

    const col =
      gridPos % GRID;

    const row =
      Math.floor(
        gridPos / GRID
      );

    const cw =
      crop.w / GRID;

    const ch =
      crop.h / GRID;

    return {

      x:
        crop.x +
        col * cw,

      y:
        crop.y +
        row * ch,

      w:
        cw,

      h:
        ch
    };
  }


  function gridPosAt(
    x,
    y
  ) {

    if (
      x < crop.x ||
      y < crop.y ||
      x >=
        crop.x +
        crop.w ||
      y >=
        crop.y +
        crop.h
    ) {

      return -1;
    }

    const col =
      Math.floor(
        (x - crop.x) /
        (crop.w / GRID)
      );

    const row =
      Math.floor(
        (y - crop.y) /
        (crop.h / GRID)
      );

    return (
      row *
      GRID +
      col
    );
  }


  /* =========================================================
     SLICE CROPPED IMAGE
  ========================================================= */

  function sliceIntoTiles(
    sourceCanvas
  ) {

    tileCanvases =
      [];

    const cw =
      crop.w / GRID;

    const ch =
      crop.h / GRID;

    for (
      let i = 0;
      i < GRID * GRID;
      i++
    ) {

      const col =
        i % GRID;

      const row =
        Math.floor(
          i / GRID
        );

      const tc =
        document.createElement(
          "canvas"
        );

      /*
        Keep actual pixel values
        rather than CSS values.
      */

      tc.width =
        Math.max(
          1,
          Math.round(cw)
        );

      tc.height =
        Math.max(
          1,
          Math.round(ch)
        );

      const tctx =
        tc.getContext("2d");

      tctx.drawImage(

        sourceCanvas,

        crop.x +
          col * cw,

        crop.y +
          row * ch,

        cw,
        ch,

        0,
        0,

        tc.width,
        tc.height

      );

      tileCanvases.push(
        tc
      );
    }
  }


  /* =========================================================
     SHUFFLE
  ========================================================= */

  function shuffle() {

    order =
      [
        ...Array(
          GRID * GRID
        ).keys()
      ];

    do {

      for (
        let i =
          order.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() *
            (i + 1)
          );

        [
          order[i],
          order[j]
        ] =
        [
          order[j],
          order[i]
        ];
      }

    } while (
      isSolved()
    );

    solvedShown =
      false;

    heldTile =
      null;

    moveHistory =
      [];

    updateUndoBtn();
  }


  function isSolved() {

    return order.every(
      (
        value,
        index
      ) =>
        value === index
    );
  }


  /* =========================================================
     TIMER
  ========================================================= */

  function startTimer() {

    stopTimer();

    timerStart =
      Date.now();

    roundStarted =
      true;

    resultShown =
      false;

    /*
      Start at exactly 01:00.
    */

    timerEl.textContent =
      "01:00";

    timerEl.style.display =
      "block";

    updateTimer();

    timerInterval =
      setInterval(
        updateTimer,
        100
      );
  }


  function stopTimer() {

    if (
      timerInterval
    ) {

      clearInterval(
        timerInterval
      );

      timerInterval =
        null;
    }
  }


  function updateTimer() {

    if (
      !roundStarted
    ) {

      return;
    }

    const elapsed =
      Date.now() -
      timerStart;

    const remaining =
      Math.max(
        0,
        ROUND_TIME_MS -
        elapsed
      );

    const totalSeconds =
      Math.ceil(
        remaining /
        1000
      );

    const mm =
      String(
        Math.floor(
          totalSeconds /
          60
        )
      ).padStart(
        2,
        "0"
      );

    const ss =
      String(
        totalSeconds %
        60
      ).padStart(
        2,
        "0"
      );

    timerEl.textContent =
      `${mm}:${ss}`;


    if (
      remaining <= 0 &&
      !resultShown
    ) {

      stopTimer();

      roundStarted =
        false;

      showLoss();
    }
  }


  /* =========================================================
     CAPTURE CROPPED PHOTO
  ========================================================= */

  function capturePhoto() {

    /*
      Make a canvas containing the
      EXACT current camera frame.
    */

    const shot =
      document.createElement(
        "canvas"
      );

    shot.width =
      CANVAS_W;

    shot.height =
      CANVAS_H;

    const shotCtx =
      shot.getContext("2d");

    drawCoverVideo(
      shotCtx
    );


    /*
      IMPORTANT:
      sliceIntoTiles uses the current
      crop rectangle.

      So the user's selected crop
      is actually used.
    */

    sliceIntoTiles(
      shot
    );

    shuffle();

    phase =
      "puzzle";

    roundStarted =
      false;

    resultShown =
      false;

    twoHandTimerActive =
      false;

    cropGrab =
      null;

    captureBtnWrap.style.display =
      "none";

    cropControls.style.display =
      "none";

    postControls.style.display =
      "flex";

    stage.classList.add(
      "puzzle-mode"
    );

    initBubbles();

    instructions.textContent =
      "Pinch a tile and drag it onto another tile.";

    /*
      Timer starts only when puzzle
      has actually appeared.
    */

    startTimer();
  }

     ENTER CROP

  /* =========================================================
     UNDO
  ========================================================= */

  function updateUndoBtn() {

    undoBtn.disabled =
      moveHistory.length === 0;
  }


  function undoMove() {

    if (
      moveHistory.length === 0 ||
      phase !== "puzzle" ||
      !roundStarted
    ) {

      return;
    }

    const m =
      moveHistory.pop();

    const temp =
      order[m.fromPos];

    order[m.fromPos] =
      order[m.toPos];

    order[m.toPos] =
      temp;

    heldTile =
      null;

    updateUndoBtn();

    instructions.textContent =
      "Undid last move.";
  }

  /* =========================================================
     HAND SKELETON
  ========================================================= */

  function drawHandSkeleton(
    landmarks
  ) {

    const connections = [

      [0,1],
      [1,2],
      [2,3],
      [3,4],

      [0,5],
      [5,6],
      [6,7],
      [7,8],

      [5,9],
      [9,10],
      [10,11],
      [11,12],

      [9,13],
      [13,14],
      [14,15],
      [15,16],

      [13,17],
      [17,18],
      [18,19],
      [19,20],

      [0,17]

    ];


    ctx.strokeStyle =
      "rgba(217,255,58,0.9)";

    ctx.lineWidth =
      3;

    ctx.beginPath();


    connections.forEach(
      ([a,b]) => {

        const pa =
          toCanvasPoint(
            landmarks[a]
          );

        const pb =
          toCanvasPoint(
            landmarks[b]
          );

        ctx.moveTo(
          pa.x,
          pa.y
        );

        ctx.lineTo(
          pb.x,
          pb.y
        );
      }
    );


    ctx.stroke();


    /*
      Larger dots make it obvious
      when detection is working.
    */

    landmarks.forEach(
      lm => {

        const p =
          toCanvasPoint(
            lm
          );

        ctx.fillStyle =
          "#ffffff";

        ctx.beginPath();

        ctx.arc(
          p.x,
          p.y,
          4,
          0,
          Math.PI * 2
        );

        ctx.fill();
      }
    );
  }


  /* =========================================================
     CROP DRAWING
  ========================================================= */

  function cropHandleRadius() {

    return Math.max(
      28,
      Math.min(
        CANVAS_W,
        CANVAS_H
      ) *
      0.035
    );
  }


  function drawCropBox() {

    ctx.save();


    /*
      Darken outside crop.
    */

    ctx.fillStyle =
      "rgba(0,0,0,0.45)";

    ctx.fillRect(
      0,
      0,
      CANVAS_W,
      crop.y
    );

    ctx.fillRect(
      0,
      crop.y +
        crop.h,
      CANVAS_W,
      CANVAS_H -
        (
          crop.y +
          crop.h
        )
    );

    ctx.fillRect(
      0,
      crop.y,
      crop.x,
      crop.h
    );

    ctx.fillRect(
      crop.x +
        crop.w,
      crop.y,
      CANVAS_W -
        (
          crop.x +
          crop.w
        ),
      crop.h
    );


    /*
      Crop border.
    */

    ctx.strokeStyle =
      "#d9ff3a";

    ctx.lineWidth =
      4;

    ctx.strokeRect(
      crop.x,
      crop.y,
      crop.w,
      crop.h
    );


    /*
      Grid lines.
    */

    ctx.strokeStyle =
      "rgba(217,255,58,0.5)";

    ctx.lineWidth =
      1;

    for (
      let i = 1;
      i < GRID;
      i++
    ) {

      const gx =
        crop.x +
        (
          crop.w /
          GRID
        ) *
        i;

      ctx.beginPath();

      ctx.moveTo(
        gx,
        crop.y
      );

      ctx.lineTo(
        gx,
        crop.y +
          crop.h
      );

      ctx.stroke();


      const gy =
        crop.y +
        (
          crop.h /
          GRID
        ) *
        i;

      ctx.beginPath();

      ctx.moveTo(
        crop.x,
        gy
      );

      ctx.lineTo(
        crop.x +
          crop.w,
        gy
      );

      ctx.stroke();
    }


    /*
      Four handles.
    */

    const r =
      cropHandleRadius();


    [
      [
        crop.x,
        crop.y
      ],

      [
        crop.x +
          crop.w,
        crop.y
      ],

      [
        crop.x,
        crop.y +
          crop.h
      ],

      [
        crop.x +
          crop.w,
        crop.y +
          crop.h
      ]

    ].forEach(
      ([cx,cy]) => {

        ctx.beginPath();

        ctx.arc(
          cx,
          cy,
          r * 0.42,
          0,
          Math.PI * 2
        );

        ctx.fillStyle =
          "#d9ff3a";

        ctx.fill();


        ctx.beginPath();

        ctx.arc(
          cx,
          cy,
          r,
          0,
          Math.PI * 2
        );

        ctx.strokeStyle =
          "rgba(217,255,58,0.55)";

        ctx.lineWidth =
          2;

        ctx.stroke();
      }
    );


    ctx.restore();
  }


  /* =========================================================
     TWO-HAND CROP TIMER
  ========================================================= */

  function drawTwoHandTimer() {

    if (
      !twoHandTimerActive
    ) {

      return;
    }

    const elapsed =
      performance.now() -
      twoHandTimerStart;

    const remaining =
      Math.max(
        0,
        CROP_HOLD_MS -
          elapsed
      );

    const progress =
      1 -
      remaining /
        CROP_HOLD_MS;

    const cx =
      CANVAS_W / 2;

    const cy =
      Math.min(
        CANVAS_H * 0.16,
        130
      );

    const R =
      Math.max(
        28,
        Math.min(
          CANVAS_W,
          CANVAS_H
        ) *
        0.045
      );


    ctx.save();


    ctx.beginPath();

    ctx.arc(
      cx,
      cy,
      R,
      0,
      Math.PI * 2
    );

    ctx.fillStyle =
      "rgba(0,0,0,0.55)";

    ctx.fill();


    ctx.beginPath();

    ctx.arc(
      cx,
      cy,
      R,
      -Math.PI / 2,
      -Math.PI / 2 +
        progress *
        Math.PI *
        2
    );

    ctx.strokeStyle =
      "#d9ff3a";

    ctx.lineWidth =
      5;

    ctx.stroke();


    ctx.fillStyle =
      "#fff";

    ctx.font =
      `bold ${Math.round(
        R * 0.9
      )}px sans-serif`;

    ctx.textAlign =
      "center";

    ctx.textBaseline =
      "middle";

    ctx.fillText(
      Math.ceil(
        remaining /
        1000
      ).toString(),

      cx,

      cy + 1
    );


    ctx.restore();
  }


  /* =========================================================
     RENDER
  ========================================================= */

  function render() {

    ctx.clearRect(
      0,
      0,
      CANVAS_W,
      CANVAS_H
    );


    if (
      phase === "preview" ||
      phase === "crop"
    ) {

      /*
        WEBCAM.
      */

      drawCoverVideo(
        ctx
      );


      if (
        phase === "crop"
      ) {

        drawCropBox();

        drawTwoHandTimer();
      }

    } else {

      /*
        PUZZLE BACKGROUND.
      */

      drawBubbles();


      /*
        Draw puzzle tiles.
      */

      for (
        let pos = 0;
        pos <
          order.length;
        pos++
      ) {

        const tileId =
          order[pos];


        if (
          heldTile &&
          heldTile.tileId ===
            tileId
        ) {

          continue;
        }


        const r =
          cellRect(pos);


        ctx.drawImage(
          tileCanvases[
            tileId
          ],

          r.x,
          r.y,
          r.w,
          r.h
        );
      }


      /*
        Grid.
      */

      ctx.strokeStyle =
        "rgba(255,255,255,0.5)";

      ctx.lineWidth =
        1;


      for (
        let i = 1;
        i < GRID;
        i++
      ) {

        const gx =
          crop.x +
          (
            crop.w /
            GRID
          ) *
          i;

        ctx.beginPath();

        ctx.moveTo(
          gx,
          crop.y
        );

        ctx.lineTo(
          gx,
          crop.y +
            crop.h
        );

        ctx.stroke();


        const gy =
          crop.y +
          (
            crop.h /
            GRID
          ) *
          i;

        ctx.beginPath();

        ctx.moveTo(
          crop.x,
          gy
        );

        ctx.lineTo(
          crop.x +
            crop.w,
          gy
        );

        ctx.stroke();
      }


      /*
        Held tile.
      */

      if (
        heldTile &&
        cursor.visible
      ) {

        const cw =
          crop.w / GRID;

        const ch =
          crop.h / GRID;

        const dw =
          cw * 1.08;

        const dh =
          ch * 1.08;


        ctx.save();

        ctx.shadowColor =
          "rgba(0,0,0,0.6)";

        ctx.shadowBlur =
          18;


        ctx.drawImage(

          tileCanvases[
            heldTile.tileId
          ],

          cursor.x -
            dw / 2,

          cursor.y -
            dh / 2,

          dw,
          dh

        );


        ctx.restore();
      }


      /*
        Win detection.
      */

      if (
        isSolved() &&
        !solvedShown
      ) {

        solvedShown =
          true;

        roundStarted =
          false;

        stopTimer();

        /*
          IMPORTANT:
          Don't immediately show popup.
          Wait 2 seconds.
        */

        setTimeout(
          showWin,
          2000
        );
      }


      if (
        isSolved()
      ) {

        ctx.fillStyle =
          "rgba(255,255,255,0.95)";

        ctx.font =
          `bold ${Math.round(
            CANVAS_W *
            0.032
          )}px sans-serif`;

        ctx.textAlign =
          "center";

        ctx.fillText(
          "SOLVED",
          CANVAS_W / 2,
          CANVAS_H * 0.1
        );
      }
    }


    /*
      ALWAYS draw detected hands.
      This makes detection visible
      during preview/crop/puzzle.
    */

    cachedHands.forEach(
      hand => {

        drawHandSkeleton(
          hand.landmarks
        );
      }
    );


    /*
      Cursor.
    */

    if (
      cursor.visible &&
      (
        phase === "puzzle" ||
        phase === "crop"
      )
    ) {

      ctx.beginPath();

      ctx.arc(
        cursor.x,
        cursor.y,
        11,
        0,
        Math.PI * 2
      );

      ctx.strokeStyle =
        heldTile
          ? "#d9ff3a"
          : "rgba(255,255,255,0.9)";

      ctx.lineWidth =
        3;

      ctx.stroke();
    }
  }


  /* =========================================================
     SINGLE HAND CROP
  ========================================================= */

  function handleSingleHandCrop(
    hand
  ) {

    if (!hand) {

      prevPinching =
        false;

      cropGrab =
        null;

      cursor.visible =
        false;

      return;
    }


    const pinching =
      hand.pinching;


    cursor.x =
      hand.pinchPoint.x;

    cursor.y =
      hand.pinchPoint.y;

    cursor.visible =
      true;


    if (
      pinching &&
      !prevPinching
    ) {

      const r =
        cropHandleRadius();


      const corners = {

        tl: {
          x: crop.x,
          y: crop.y
        },

        tr: {
          x:
            crop.x +
            crop.w,

          y:
            crop.y
        },

        bl: {
          x:
            crop.x,

          y:
            crop.y +
            crop.h
        },

        br: {
          x:
            crop.x +
            crop.w,

          y:
            crop.y +
            crop.h
        }

      };


      let mode =
        null;


      for (
        const key in corners
      ) {

        if (
          dist(
            cursor,
            corners[key]
          ) < r
        ) {

          mode =
            key;

          break;
        }
      }


      /*
        If not on a corner,
        allow moving the entire
        crop rectangle.
      */

      if (
        !mode &&
        cursor.x >
          crop.x &&
        cursor.x <
          crop.x +
          crop.w &&
        cursor.y >
          crop.y &&
        cursor.y <
          crop.y +
          crop.h
      ) {

        mode =
          "move";
      }


      if (mode) {

        cropGrab = {

          mode,

          startX:
            cursor.x,

          startY:
            cursor.y,

          orig:
            {
              ...crop
            }

        };
      }


    } else if (
      pinching &&
      prevPinching &&
      cropGrab
    ) {

      const dx =
        cursor.x -
        cropGrab.startX;

      const dy =
        cursor.y -
        cropGrab.startY;

      const o =
        cropGrab.orig;


      switch (
        cropGrab.mode
      ) {

        case "move":

          crop.x =
            o.x + dx;

          crop.y =
            o.y + dy;

          break;


        case "tl":

          crop.x =
            o.x + dx;

          crop.y =
            o.y + dy;

          crop.w =
            o.w - dx;

          crop.h =
            o.h - dy;

          break;


        case "tr":

          crop.y =
            o.y + dy;

          crop.w =
            o.w + dx;

          crop.h =
            o.h - dy;

          break;


        case "bl":

          crop.x =
            o.x + dx;

          crop.w =
            o.w - dx;

          crop.h =
            o.h + dy;

          break;


        case "br":

          crop.w =
            o.w + dx;

          crop.h =
            o.h + dy;

          break;
      }


      clampCrop();


    } else if (
      !pinching &&
      prevPinching
    ) {

      cropGrab =
        null;
    }


    prevPinching =
      pinching;
  }


  /* =========================================================
     TWO-HAND CROP
  ========================================================= */

  function handleCropLogic(
    hands2
  ) {

    const twoHandMode =
      hands2.length >= 2 &&
      hands2[0].pinching &&
      hands2[1].pinching;


    if (
      twoHandMode
    ) {

      cropGrab =
        null;


      const p1 =
        hands2[0]
          .pinchPoint;

      const p2 =
        hands2[1]
          .pinchPoint;


      crop = {

        x:
          Math.min(
            p1.x,
            p2.x
          ),

        y:
          Math.min(
            p1.y,
            p2.y
          ),

        w:
          Math.abs(
            p1.x -
            p2.x
          ),

        h:
          Math.abs(
            p1.y -
            p2.y
          )

      };


      softClampCrop();


      if (
        !twoHandTimerActive
      ) {

        twoHandTimerActive =
          true;

        twoHandTimerStart =
          performance.now();
      }


      /*
        Auto-capture ONLY after
        holding both pinches for
        5 seconds.
      */

      if (
        performance.now() -
          twoHandTimerStart >=
        CROP_HOLD_MS
      ) {

        clampCrop();

        capturePhoto();
      }


      cursor.visible =
        false;

      return;
    }


    twoHandTimerActive =
      false;


    handleSingleHandCrop(
      hands2[0] ||
      null
    );
  }


  /* =========================================================
     PUZZLE HAND LOGIC
  ========================================================= */

  function handlePuzzleLogic(
    hand
  ) {

    if (!hand) {

      cursor.visible =
        false;

      prevPinching =
        false;

      heldTile =
        null;

      return;
    }


    cursor.x =
      hand.pinchPoint.x;

    cursor.y =
      hand.pinchPoint.y;

    cursor.visible =
      true;


    const pinching =
      hand.pinching;


    /*
      START HOLDING TILE.
    */

    if (
      pinching &&
      !prevPinching
    ) {

      const pos =
        gridPosAt(
          cursor.x,
          cursor.y
        );


      if (
        pos !== -1 &&
        !heldTile
      ) {

        heldTile = {

          tileId:
            order[pos],

          fromPos:
            pos

        };
      }
    }


    /*
      RELEASE TILE.
    */

    else if (
      !pinching &&
      prevPinching
    ) {

      if (
        heldTile
      ) {

        const dropPos =
          gridPosAt(
            cursor.x,
            cursor.y
          );


        if (
          dropPos !== -1 &&
          dropPos !==
            heldTile.fromPos
        ) {

          const otherTile =
            order[
              dropPos
            ];


          order[
            dropPos
          ] =
            heldTile.tileId;


          order[
            heldTile.fromPos
          ] =
            otherTile;


          moveHistory.push({

            fromPos:
              heldTile.fromPos,

            toPos:
              dropPos

          });


          updateUndoBtn();
        }


        heldTile =
          null;
      }
    }


    prevPinching =
      pinching;
  }


  /* =========================================================
     MOUSE / TOUCH CROP SUPPORT
     
     THIS IS EXTRA ON PURPOSE:
     If the hand crop is annoying,
     you can still adjust the crop
     manually.
  ========================================================= */

  let pointerCropGrab =
    null;


  function getPointerCanvasPoint(
    event
  ) {

    const rect =
      canvas.getBoundingClientRect();


    return {

      x:
        (
          event.clientX -
          rect.left
        ) *
        (
          canvas.width /
          rect.width
        ),

      y:
        (
          event.clientY -
          rect.top
        ) *
        (
          canvas.height /
          rect.height
        )

    };
  }


  canvas.addEventListener(
    "pointerdown",
    event => {

      if (
        phase !== "crop"
      ) {

        return;
      }


      const p =
        getPointerCanvasPoint(
          event
        );


      const r =
        cropHandleRadius();


      const corners = {

        tl: {
          x: crop.x,
          y: crop.y
        },

        tr: {
          x:
            crop.x +
            crop.w,

          y:
            crop.y
        },

        bl: {
          x:
            crop.x,

          y:
            crop.y +
            crop.h
        },

        br: {
          x:
            crop.x +
            crop.w,

          y:
            crop.y +
            crop.h
        }

      };


      let mode =
        null;


      for (
        const key in corners
      ) {

        if (
          dist(
            p,
            corners[key]
          ) <
          r * 1.3
        ) {

          mode =
            key;

          break;
        }
      }


      if (
        !mode &&
        p.x >
          crop.x &&
        p.x <
          crop.x +
          crop.w &&
        p.y >
          crop.y &&
        p.y <
          crop.y +
          crop.h
      ) {

        mode =
          "move";
      }


      if (
        mode
      ) {

        pointerCropGrab = {

          mode,

          startX:
            p.x,

          startY:
            p.y,

          orig:
            {
              ...crop
            }

        };

        canvas.setPointerCapture(
          event.pointerId
        );
      }
    }
  );


  canvas.addEventListener(
    "pointermove",
    event => {

      if (
        phase !== "crop" ||
        !pointerCropGrab
      ) {

        return;
      }


      const p =
        getPointerCanvasPoint(
          event
        );


      const dx =
        p.x -
        pointerCropGrab.startX;

      const dy =
        p.y -
        pointerCropGrab.startY;


      const o =
        pointerCropGrab.orig;


      switch (
        pointerCropGrab.mode
      ) {

        case "move":

          crop.x =
            o.x + dx;

          crop.y =
            o.y + dy;

          break;


        case "tl":

          crop.x =
            o.x + dx;

          crop.y =
            o.y + dy;

          crop.w =
            o.w - dx;

          crop.h =
            o.h - dy;

          break;


        case "tr":

          crop.y =
            o.y + dy;

          crop.w =
            o.w + dx;

          crop.h =
            o.h - dy;

          break;


        case "bl":

          crop.x =
            o.x + dx;

          crop.w =
            o.w - dx;

          crop.h =
            o.h + dy;

          break;


        case "br":

          crop.w =
            o.w + dx;

          crop.h =
            o.h + dy;

          break;
      }


      clampCrop();
    }
  );


  canvas.addEventListener(
    "pointerup",
    event => {

      pointerCropGrab =
        null;

      try {

        canvas.releasePointerCapture(
          event.pointerId
        );

      } catch {}
    }
  );


  /* =========================================================
     SCOREBOARD
  ========================================================= */

  function escapeHTML(
    value
  ) {

    return String(value)

      .replace(
        /&/g,
        "&amp;"
      )

      .replace(
        /</g,
        "&lt;"
      )

      .replace(
        />/g,
        "&gt;"
      )

      .replace(
        /"/g,
        "&quot;"
      )

      .replace(
        /'/g,
        "&#039;"
      );
  }


  function getScores() {

    try {

      const saved =
        localStorage.getItem(
          SCORE_KEY
        );


      if (!saved) {

        return [];
      }


      const scores =
        JSON.parse(
          saved
        );


      return Array.isArray(
        scores
      )
        ? scores
        : [];

    } catch (
      error
    ) {

      console.error(
        error
      );

      return [];
    }
  }


  function saveScores(
    scores
  ) {

    try {

      localStorage.setItem(
        SCORE_KEY,
        JSON.stringify(
          scores
        )
      );

    } catch (
      error
    ) {

      console.error(
        error
      );
    }
  }


  function formatScoreTime(
    milliseconds
  ) {

    const seconds =
      Math.ceil(
        milliseconds /
        1000
      );

    const mm =
      String(
        Math.floor(
          seconds /
          60
        )
      ).padStart(
        2,
        "0"
      );

    const ss =
      String(
        seconds %
        60
      ).padStart(
        2,
        "0"
      );


    return `${mm}:${ss}`;
  }


  function renderScoreboard() {

    const scores =
      getScores();


    if (
      scores.length === 0
    ) {

      scoreboardList.innerHTML =
        `
          <div class="no-scores">
            No scores yet. Be the first! 🌊
          </div>
        `;

      return;
    }


    scoreboardList.innerHTML =
      scores
        .slice(0, 50)
        .map(
          (
            score,
            index
          ) => {

            const date =
              score.date
                ? new Date(
                    score.date
                  ).toLocaleDateString()
                : "";


            return `

              <div class="score-row">

                <span>
                  ${index + 1}
                </span>

                <span class="score-name">
                  ${escapeHTML(
                    score.name
                  )}
                </span>

                <span class="score-time">
                  ${escapeHTML(
                    score.time
                  )}
                </span>

                <span class="score-date">
                  ${escapeHTML(
                    date
                  )}
                </span>

              </div>

            `;
          }
        )
        .join("");
  }


  function saveWinningScore(
    elapsedMs
  ) {

    const scores =
      getScores();


    scores.push({

      name:
        playerName ||
        "Player",

      time:
        formatScoreTime(
          elapsedMs
        ),

      elapsedMs:
        elapsedMs,

      date:
        new Date().toISOString()

    });


    /*
      Fastest first.
    */

    scores.sort(
      (
        a,
        b
      ) =>
        a.elapsedMs -
        b.elapsedMs
    );


    saveScores(
      scores.slice(
        0,
        50
      )
    );


    renderScoreboard();
  }


  /* =========================================================
     SCOREBOARD OPEN/CLOSE
  ========================================================= */

  scoreboardBtn.addEventListener(
    "click",
    () => {

      renderScoreboard();

      scoreboardModal.style.display =
        "flex";
    }
  );


  closeScoreboardBtn.addEventListener(
    "click",
    () => {

      scoreboardModal.style.display =
        "none";
    }
  );


  scoreboardModal.addEventListener(
    "click",
    event => {

      if (
        event.target ===
        scoreboardModal
      ) {

        scoreboardModal.style.display =
          "none";
      }
    }
  );


  /* =========================================================
     WIN
  ========================================================= */

  function showWin() {

    if (
      resultShown
    ) {

      return;
    }


    resultShown =
      true;

    roundStarted =
      false;

    stopTimer();


    const elapsedMs =
      Math.min(
        ROUND_TIME_MS,
        Math.max(
          0,
          Date.now() -
            timerStart
        )
      );


    saveWinningScore(
      elapsedMs
    );


    resultEmoji.textContent =
      "🎉";


    resultTitle.textContent =
      "yay you get a prize";


    resultDetails.textContent =
      `${playerName || "Player"} solved the puzzle in ${formatScoreTime(elapsedMs)}.`;


    resultModal.style.display =
      "flex";


    /*
      Prize popup = 3 seconds.
      Then ENTER YOUR NAME.
    */

    setTimeout(
      () => {

        resultModal.style.display =
          "none";

        returnToNameScreen();

      },
      3000
    );
  }


  /* =========================================================
     LOSS
  ========================================================= */

  function showLoss() {

    if (
      resultShown
    ) {

      return;
    }


    resultShown =
      true;

    roundStarted =
      false;

    stopTimer();


    timerEl.style.display =
      "none";


    resultEmoji.textContent =
      "😭";


    resultTitle.textContent =
      "oh no better luck next time!";


    resultDetails.textContent =
      "The 1 minute time limit is over.";


    resultModal.style.display =
      "flex";


    /*
      IMPORTANT:

      Losing also returns to
      ENTER YOUR NAME.

      No 3-minute restart.
    */

    setTimeout(
      () => {

        resultModal.style.display =
          "none";

        returnToNameScreen();

      },
      3000
    );
  }


  /* =========================================================
     START GAME / NAME
  ========================================================= */

  startGameBtn.addEventListener(
    "click",
    startFromName
  );


  playerNameInput.addEventListener(
    "keydown",
    event => {

      if (
        event.key ===
        "Enter"
      ) {

        startFromName();
      }
    }
  );


  function startFromName() {

    const name =
      playerNameInput.value
        .trim();


    if (!name) {

      playerNameInput.focus();

      return;
    }


    playerName =
      name.slice(
        0,
        20
      );


    localStorage.setItem(
      "oceanJigsawPlayerName",
      playerName
    );


    startModal.style.display =
      "none";


    phase =
      "preview";


    instructions.textContent =
      `Good luck, ${playerName}! Frame yourself, then capture.`;
  }


  /* =========================================================
     INITIALIZE SCOREBOARD + NAME SCREEN
  ========================================================= */

  renderScoreboard();


  /*
    ALWAYS ask for name when the
    page is opened.
  */

  startModal.style.display =
    "flex";


  setTimeout(
    () => {

      playerNameInput.focus();

    },
    100
  );


  /* =========================================================
     MEDIAPIPE INITIALIZATION
  ========================================================= */

  async function initHandTracking() {

    instructions.textContent =
      "Loading hand tracking…";


    const filesetResolver =
      await FilesetResolver.forVisionTasks(

        "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"

      );


    handLandmarker =
      await HandLandmarker.createFromOptions(

        filesetResolver,

        {

          baseOptions: {

            modelAssetPath:
              "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

            delegate:
              "GPU"

          },


          runningMode:
            "VIDEO",


          numHands:
            2,


          minHandDetectionConfidence:
            0.35,


          minHandPresenceConfidence:
            0.35,


          minTrackingConfidence:
            0.35

        }

      );


    modelReady =
      true;


    instructions.textContent =
      "Hand tracking ready — frame yourself, then capture.";
  }


  /* =========================================================
     CAMERA LOOP
  ========================================================= */

  async function cameraLoop() {

    if (
      !video.videoWidth ||
      video.readyState < 2
    ) {

      requestAnimationFrame(
        cameraLoop
      );

      return;
    }


    render();


    /*
      Don't overload the detector.
    */

    if (
      !modelReady ||
      !handLandmarker ||
      detectBusy
    ) {

      requestAnimationFrame(
        cameraLoop
      );

      return;
    }


    /*
      Run detection every second
      frame for performance.
    */

    frameCount++;


    if (
      frameCount % 2 !== 0
    ) {

      requestAnimationFrame(
        cameraLoop
      );

      return;
    }


    /*
      MediaPipe VIDEO mode requires
      increasing timestamps.
    */

    const videoTime =
      video.currentTime;


    if (
      !Number.isFinite(
        videoTime
      ) ||
      videoTime <=
        lastVideoTime
    ) {

      requestAnimationFrame(
        cameraLoop
      );

      return;
    }


    lastVideoTime =
      videoTime;


    detectBusy =
      true;


    try {

      const timestampMs =
        Math.round(
          videoTime *
          1000
        );


      const result =
        handLandmarker.detectForVideo(

          video,

          timestampMs

        );


      cachedHands =
        (
          result.landmarks ||
          []
        ).map(
          processHand
        );


      /*
        If we're detecting hands,
        keep the normal instruction
        unless we're in the puzzle.
      */

      if (
        phase === "crop"
      ) {

        handleCropLogic(
          cachedHands
        );

      } else if (
        phase === "puzzle"
      ) {

        handlePuzzleLogic(
          cachedHands[0] ||
          null
        );

      }


    } catch (
      error
    ) {

      console.error(
        "Hand detection error:",
        error
      );

    } finally {

      detectBusy =
        false;
    }


    requestAnimationFrame(
      cameraLoop
    );
  }


  /* =========================================================
     CAMERA START
  ========================================================= */

  async function startCamera() {

    try {

      const stream =
        await navigator.mediaDevices.getUserMedia({

          video: {

            width: {
              ideal: 640,
              min: 320
            },

            height: {
              ideal: 480,
              min: 240
            },

            facingMode:
              "user"

          },

          audio:
            false

        });


      video.srcObject =
        stream;


      await new Promise(
        resolve => {

          if (
            video.readyState >= 1
          ) {

            resolve();

          } else {

            video.addEventListener(
              "loadedmetadata",
              resolve,
              {
                once:
                  true
              }
            );
          }

        }
      );


      await video.play();


      /*
        Load MediaPipe AFTER camera
        has successfully started.
      */

      await initHandTracking();


      lastVideoTime =
        -1;


      requestAnimationFrame(
        cameraLoop
      );


    } catch (
      error
    ) {

      console.error(
        error
      );


      instructions.textContent =
        "Camera or hand tracking failed. Please allow camera access and refresh.";
    }
  }


  startCamera();


  /* =========================================================
     RESIZE
  ========================================================= */

  window.addEventListener(
    "resize",
    () => {

      const oldW =
        CANVAS_W;

      const oldH =
        CANVAS_H;


      resizeCanvas();


      if (
        phase === "crop" &&
        oldW &&
        oldH
      ) {

        crop.x *=
          CANVAS_W /
          oldW;

        crop.w *=
          CANVAS_W /
          oldW;

        crop.y *=
          CANVAS_H /
          oldH;

        crop.h *=
          CANVAS_H /
          oldH;


        clampCrop();
      }


      if (
        phase === "puzzle"
      ) {

        initBubbles();
      }

    }
  );


})();

</script>
