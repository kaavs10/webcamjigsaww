<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Live Puzzle — Hand Tracking</title>
<style>
  :root { --accent: #d9ff3a; }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
    background: #000;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
  }
  #stage {
    position: fixed;
    inset: 0;
    width: 100vw;
    height: 100vh;
  }
  video { display: none; }
  canvas {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    display: block;
  }
  .top-bar {
    position: fixed;
    top: 0; left: 0; right: 0;
    padding: max(14px, env(safe-area-inset-top)) 16px 10px;
    text-align: center;
    background: linear-gradient(to bottom, rgba(0,0,0,0.55), transparent);
    z-index: 10;
    pointer-events: none;
  }
  .top-bar h1 {
    font-size: 0.95rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 3px;
  }
  .top-bar p {
    color: #ddd;
    font-size: 0.78rem;
    margin: 0;
  }
  .bottom-bar {
    position: fixed;
    bottom: max(20px, env(safe-area-inset-bottom));
    left: 0; right: 0;
    display: flex;
    gap: 10px;
    justify-content: center;
    z-index: 10;
  }
  button {
    background: var(--accent);
    color: #111;
    border: none;
    padding: 13px 24px;
    border-radius: 999px;
    font-weight: 700;
    font-size: 0.9rem;
    cursor: pointer;
    letter-spacing: 0.02em;
    box-shadow: 0 4px 16px rgba(0,0,0,0.35);
  }
  button.secondary {
    background: rgba(0,0,0,0.5);
    color: var(--accent);
    border: 1.5px solid var(--accent);
  }
  .status {
    position: fixed;
    bottom: max(78px, calc(env(safe-area-inset-bottom) + 78px));
    left: 0; right: 0;
    text-align: center;
    font-size: 0.8rem;
    color: #eee;
    z-index: 10;
    pointer-events: none;
    text-shadow: 0 1px 4px rgba(0,0,0,0.8);
  }
</style>
</head>
<body>

<div class="top-bar">
  <h1>Live Puzzle</h1>
  <p id="instructions">Allow camera access to begin…</p>
</div>

<div id="stage">
  <video id="video" playsinline autoplay muted></video>
  <canvas id="canvas"></canvas>
</div>

<div class="status" id="status"></div>

<div class="bottom-bar" id="captureBtnWrap">
  <button id="captureBtn">📸 Capture Photo</button>
</div>

<div class="bottom-bar" id="postControls" style="display:none;">
  <button id="shuffleBtn">🔀 Shuffle</button>
  <button class="secondary" id="retakeBtn">↺ Retake</button>
</div>

<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>

<script>
(function () {
  const video = document.getElementById('video');
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  const instructions = document.getElementById('instructions');
  const statusEl = document.getElementById('status');
  const captureBtn = document.getElementById('captureBtn');
  const captureBtnWrap = document.getElementById('captureBtnWrap');
  const postControls = document.getElementById('postControls');
  const shuffleBtn = document.getElementById('shuffleBtn');
  const retakeBtn = document.getElementById('retakeBtn');

  const GRID = 3;
  const DETECT_W = 320, DETECT_H = 240; // downscaled copy fed to MediaPipe for speed

  let CANVAS_W = 0, CANVAS_H = 0;

  function resizeCanvas() {
    CANVAS_W = canvas.width = window.innerWidth;
    CANVAS_H = canvas.height = window.innerHeight;
  }
  resizeCanvas();

  const detectCanvas = document.createElement('canvas');
  detectCanvas.width = DETECT_W;
  detectCanvas.height = DETECT_H;
  const detectCtx = detectCanvas.getContext('2d');

  // phase: 'preview' -> 'crop' -> 'puzzle'
  let phase = 'preview';
  let tileCanvases = [];
  let order = [];
  let heldTile = null;
  let cursor = { x: 0, y: 0, visible: false };
  let prevPinching = false;
  let solvedShown = false;

  // crop rect, in CANVAS pixel space
  let crop = { x: 0, y: 0, w: 0, h: 0 };
  let cropGrab = null; // { mode: 'move'|'tl'|'tr'|'bl'|'br', startX, startY, orig }

  // --- cover-fit video mapping (video -> full-screen canvas) ---
  function getCoverTransform() {
    const vw = video.videoWidth || DETECT_W;
    const vh = video.videoHeight || DETECT_H;
    const scale = Math.max(CANVAS_W / vw, CANVAS_H / vh);
    const drawW = vw * scale, drawH = vh * scale;
    const offsetX = (CANVAS_W - drawW) / 2;
    const offsetY = (CANVAS_H - drawH) / 2;
    return { vw, vh, scale, drawW, drawH, offsetX, offsetY };
  }

  function drawCoverVideo(targetCtx) {
    const t = getCoverTransform();
    targetCtx.save();
    targetCtx.translate(t.offsetX + t.drawW, t.offsetY);
    targetCtx.scale(-1, 1); // mirror
    targetCtx.drawImage(video, 0, 0, t.drawW, t.drawH);
    targetCtx.restore();
  }

  // maps a normalized MediaPipe landmark (from the raw, unmirrored video) to
  // the same mirrored, cover-scaled canvas space everything else is drawn in
  function toCanvasPoint(landmark) {
    const t = getCoverTransform();
    const rawX = landmark.x * t.vw;
    const mirroredX = t.vw - rawX;
    return {
      x: t.offsetX + mirroredX * t.scale,
      y: t.offsetY + landmark.y * t.vh * t.scale
    };
  }

  function defaultCrop() {
    const size = Math.min(CANVAS_W, CANVAS_H) * 0.82;
    crop = {
      x: (CANVAS_W - size) / 2,
      y: (CANVAS_H - size) / 2,
      w: size,
      h: size
    };
  }

  function clampCrop() {
    const min = Math.min(CANVAS_W, CANVAS_H) * 0.18;
    if (crop.w < min) crop.w = min;
    if (crop.h < min) crop.h = min;
    if (crop.w > CANVAS_W) crop.w = CANVAS_W;
    if (crop.h > CANVAS_H) crop.h = CANVAS_H;
    if (crop.x < 0) crop.x = 0;
    if (crop.y < 0) crop.y = 0;
    if (crop.x + crop.w > CANVAS_W) crop.x = CANVAS_W - crop.w;
    if (crop.y + crop.h > CANVAS_H) crop.y = CANVAS_H - crop.h;
  }

  function cellRect(gridPos) {
    const col = gridPos % GRID;
    const row = Math.floor(gridPos / GRID);
    const cw = crop.w / GRID, ch = crop.h / GRID;
    return { x: crop.x + col * cw, y: crop.y + row * ch, w: cw, h: ch };
  }

  function gridPosAt(x, y) {
    if (x < crop.x || y < crop.y || x >= crop.x + crop.w || y >= crop.y + crop.h) return -1;
    const col = Math.floor((x - crop.x) / (crop.w / GRID));
    const row = Math.floor((y - crop.y) / (crop.h / GRID));
    return row * GRID + col;
  }

  function sliceIntoTiles(sourceCanvas) {
    tileCanvases = [];
    const cw = crop.w / GRID, ch = crop.h / GRID;
    for (let i = 0; i < GRID * GRID; i++) {
      const col = i % GRID, row = Math.floor(i / GRID);
      const tc = document.createElement('canvas');
      tc.width = cw; tc.height = ch;
      const tctx = tc.getContext('2d');
      tctx.drawImage(sourceCanvas, crop.x + col * cw, crop.y + row * ch, cw, ch, 0, 0, cw, ch);
      tileCanvases.push(tc);
    }
  }

  function shuffle() {
    order = [...Array(GRID * GRID).keys()];
    do {
      for (let i = order.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [order[i], order[j]] = [order[j], order[i]];
      }
    } while (isSolved());
    solvedShown = false;
    heldTile = null;
  }

  function isSolved() { return order.every((v, i) => v === i); }

  function capturePhoto() {
    const shot = document.createElement('canvas');
    shot.width = CANVAS_W; shot.height = CANVAS_H;
    drawCoverVideo(shot.getContext('2d'));
    sliceIntoTiles(shot);
    shuffle();
    phase = 'puzzle';
    captureBtnWrap.style.display = 'none';
    postControls.style.display = 'flex';
    instructions.textContent = 'Pinch a tile, drag it onto another to swap.';
    statusEl.textContent = '';
  }

  captureBtn.addEventListener('click', () => {
    if (phase === 'preview') {
      phase = 'crop';
      defaultCrop();
      captureBtn.textContent = '✅ Confirm Crop';
      instructions.textContent = 'Pinch inside the box to move it, pinch a corner to resize.';
      statusEl.textContent = '';
    } else if (phase === 'crop') {
      capturePhoto();
      captureBtn.textContent = '📸 Capture Photo';
    }
  });

  shuffleBtn.addEventListener('click', () => {
    shuffle();
    instructions.textContent = 'Shuffled! Solve it again.';
  });

  retakeBtn.addEventListener('click', () => {
    phase = 'preview';
    captureBtn.textContent = '📸 Capture Photo';
    captureBtnWrap.style.display = 'flex';
    postControls.style.display = 'none';
    instructions.textContent = 'Frame yourself, then capture.';
    statusEl.textContent = '';
  });

  // --- hand tracking ---
  function dist(a, b) { return Math.hypot(a.x - b.x, a.y - b.y); }

  function drawHandSkeleton(landmarks) {
    const connections = [
      [0,1],[1,2],[2,3],[3,4],
      [0,5],[5,6],[6,7],[7,8],
      [5,9],[9,10],[10,11],[11,12],
      [9,13],[13,14],[14,15],[15,16],
      [13,17],[17,18],[18,19],[19,20],
      [0,17]
    ];
    ctx.strokeStyle = 'rgba(217,255,58,0.85)';
    ctx.lineWidth = 2;
    ctx.beginPath();
    connections.forEach(([a, b]) => {
      const pa = toCanvasPoint(landmarks[a]);
      const pb = toCanvasPoint(landmarks[b]);
      ctx.moveTo(pa.x, pa.y);
      ctx.lineTo(pb.x, pb.y);
    });
    ctx.stroke();
    landmarks.forEach(lm => {
      const p = toCanvasPoint(lm);
      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      ctx.beginPath();
      ctx.arc(p.x, p.y, 2.5, 0, Math.PI * 2);
      ctx.fill();
    });
  }

  function cropHandleRadius() { return Math.max(26, Math.min(CANVAS_W, CANVAS_H) * 0.035); }

  function drawCropBox() {
    ctx.save();
    // dim everything outside the crop box
    ctx.fillStyle = 'rgba(0,0,0,0.45)';
    ctx.fillRect(0, 0, CANVAS_W, crop.y);
    ctx.fillRect(0, crop.y + crop.h, CANVAS_W, CANVAS_H - (crop.y + crop.h));
    ctx.fillRect(0, crop.y, crop.x, crop.h);
    ctx.fillRect(crop.x + crop.w, crop.y, CANVAS_W - (crop.x + crop.w), crop.h);

    ctx.strokeStyle = '#d9ff3a';
    ctx.lineWidth = 3;
    ctx.strokeRect(crop.x, crop.y, crop.w, crop.h);

    // corner handles
    const r = cropHandleRadius();
    const corners = [
      [crop.x, crop.y], [crop.x + crop.w, crop.y],
      [crop.x, crop.y + crop.h], [crop.x + crop.w, crop.y + crop.h]
    ];
    corners.forEach(([cx, cy]) => {
      ctx.beginPath();
      ctx.arc(cx, cy, r * 0.4, 0, Math.PI * 2);
      ctx.fillStyle = '#d9ff3a';
      ctx.fill();
      ctx.beginPath();
      ctx.arc(cx, cy, r, 0, Math.PI * 2);
      ctx.strokeStyle = 'rgba(217,255,58,0.5)';
      ctx.lineWidth = 1.5;
      ctx.stroke();
    });
    ctx.restore();
  }

  function render(handLandmarks) {
    ctx.clearRect(0, 0, CANVAS_W, CANVAS_H);

    if (phase === 'preview' || phase === 'crop') {
      drawCoverVideo(ctx);
      if (phase === 'crop') drawCropBox();
    } else {
      for (let pos = 0; pos < order.length; pos++) {
        const tileId = order[pos];
        if (heldTile && heldTile.tileId === tileId) continue;
        const r = cellRect(pos);
        ctx.drawImage(tileCanvases[tileId], r.x, r.y, r.w, r.h);
      }
      ctx.strokeStyle = 'rgba(255,255,255,0.5)';
      ctx.lineWidth = 1;
      for (let i = 1; i < GRID; i++) {
        const gx = crop.x + (crop.w / GRID) * i;
        ctx.beginPath(); ctx.moveTo(gx, crop.y); ctx.lineTo(gx, crop.y + crop.h); ctx.stroke();
        const gy = crop.y + (crop.h / GRID) * i;
        ctx.beginPath(); ctx.moveTo(crop.x, gy); ctx.lineTo(crop.x + crop.w, gy); ctx.stroke();
      }
      if (heldTile && cursor.visible) {
        const cw = crop.w / GRID, ch = crop.h / GRID;
        const scale = 1.08;
        const dw = cw * scale, dh = ch * scale;
        ctx.save();
        ctx.shadowColor = 'rgba(0,0,0,0.6)';
        ctx.shadowBlur = 18;
        ctx.drawImage(tileCanvases[heldTile.tileId], cursor.x - dw / 2, cursor.y - dh / 2, dw, dh);
        ctx.restore();
      }
      if (isSolved() && !solvedShown) {
        solvedShown = true;
        instructions.innerHTML = '🎉 Solved!';
      }
      if (isSolved()) {
        ctx.fillStyle = 'rgba(217,255,58,0.95)';
        ctx.font = `bold ${Math.round(CANVAS_W * 0.045)}px sans-serif`;
        ctx.textAlign = 'center';
        ctx.fillText('SOLVED', CANVAS_W / 2, CANVAS_H * 0.12);
      }
    }

    if (handLandmarks) {
      drawHandSkeleton(handLandmarks);
      if (cursor.visible) {
        ctx.beginPath();
        ctx.arc(cursor.x, cursor.y, 11, 0, Math.PI * 2);
        ctx.strokeStyle = (heldTile || cropGrab) ? '#d9ff3a' : 'rgba(255,255,255,0.85)';
        ctx.lineWidth = 3;
        ctx.stroke();
      }
    }
  }

  function handlePinchLogic(landmarks) {
    const thumbTip = toCanvasPoint(landmarks[4]);
    const indexTip = toCanvasPoint(landmarks[8]);
    const wrist = toCanvasPoint(landmarks[0]);
    const midMcp = toCanvasPoint(landmarks[9]);
    const handScale = Math.max(dist(wrist, midMcp), 20);
    const pinchThreshold = handScale * 0.45;

    const pinchDist = dist(thumbTip, indexTip);
    const pinching = pinchDist < pinchThreshold;

    cursor.x = (thumbTip.x + indexTip.x) / 2;
    cursor.y = (thumbTip.y + indexTip.y) / 2;
    cursor.visible = true;

    if (phase === 'crop') {
      if (pinching && !prevPinching) {
        // pinch just started -> figure out what we grabbed
        const r = cropHandleRadius();
        const corners = {
          tl: { x: crop.x, y: crop.y },
          tr: { x: crop.x + crop.w, y: crop.y },
          bl: { x: crop.x, y: crop.y + crop.h },
          br: { x: crop.x + crop.w, y: crop.y + crop.h }
        };
        let mode = null;
        for (const key in corners) {
          if (dist(cursor, corners[key]) < r) { mode = key; break; }
        }
        if (!mode && cursor.x > crop.x && cursor.x < crop.x + crop.w &&
            cursor.y > crop.y && cursor.y < crop.y + crop.h) {
          mode = 'move';
        }
        if (mode) {
          cropGrab = { mode, startX: cursor.x, startY: cursor.y, orig: { ...crop } };
        }
      } else if (pinching && prevPinching && cropGrab) {
        const dx = cursor.x - cropGrab.startX, dy = cursor.y - cropGrab.startY;
        const o = cropGrab.orig;
        switch (cropGrab.mode) {
          case 'move': crop.x = o.x + dx; crop.y = o.y + dy; break;
          case 'tl':   crop.x = o.x + dx; crop.y = o.y + dy; crop.w = o.w - dx; crop.h = o.h - dy; break;
          case 'tr':   crop.y = o.y + dy; crop.w = o.w + dx; crop.h = o.h - dy; break;
          case 'bl':   crop.x = o.x + dx; crop.w = o.w - dx; crop.h = o.h + dy; break;
          case 'br':   crop.w = o.w + dx; crop.h = o.h + dy; break;
        }
        clampCrop();
      } else if (!pinching && prevPinching) {
        cropGrab = null;
      }
      prevPinching = pinching;
      return;
    }

    if (phase !== 'puzzle') { prevPinching = pinching; return; }

    if (pinching && !prevPinching) {
      const pos = gridPosAt(cursor.x, cursor.y);
      if (pos !== -1 && !heldTile) {
        heldTile = { tileId: order[pos], fromPos: pos };
      }
    } else if (!pinching && prevPinching) {
      if (heldTile) {
        const dropPos = gridPosAt(cursor.x, cursor.y);
        if (dropPos !== -1 && dropPos !== heldTile.fromPos) {
          const otherTile = order[dropPos];
          order[dropPos] = heldTile.tileId;
          order[heldTile.fromPos] = otherTile;
        }
        heldTile = null;
      }
    }
    prevPinching = pinching;
  }

  // --- MediaPipe setup, throttled + downscaled for performance ---
  const hands = new Hands({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${file}`
  });
  hands.setOptions({
    maxNumHands: 1,
    modelComplexity: 1,
    minDetectionConfidence: 0.5,
    minTrackingConfidence: 0.6
  });

  let frameCount = 0;
  hands.onResults((results) => {
    let landmarks = null;
    if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
      landmarks = results.multiHandLandmarks[0];
      handlePinchLogic(landmarks);
    } else {
      cursor.visible = false;
      prevPinching = false;
      cropGrab = null;
    }
    render(landmarks);
  });

  const camera = new Camera(video, {
    onFrame: async () => {
      if (phase !== 'puzzle') render(null); // keep live preview smooth every frame
      if (++frameCount % 2 !== 0) return;
      // draw UNMIRRORED into the small detect canvas — toCanvasPoint() applies
      // the mirror flip itself, so this must stay raw to match it.
      detectCtx.drawImage(video, 0, 0, DETECT_W, DETECT_H);
      await hands.send({ image: detectCanvas });
    },
    width: 1280,
    height: 960
  });

  camera.start()
    .then(() => { instructions.textContent = 'Frame yourself, then capture.'; })
    .catch((err) => {
      instructions.textContent = 'Camera access failed: ' + err.message;
    });

  window.addEventListener('resize', () => {
    const oldW = CANVAS_W, oldH = CANVAS_H;
    resizeCanvas();
    if (phase === 'crop' && oldW && oldH) {
      // rescale the crop box proportionally so it doesn't jump around
      crop.x *= CANVAS_W / oldW; crop.w *= CANVAS_W / oldW;
      crop.y *= CANVAS_H / oldH; crop.h *= CANVAS_H / oldH;
      clampCrop();
    }
  });
})();
</script>
</body>
</html>
