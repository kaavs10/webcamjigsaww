<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Live Puzzle — Hand Tracking</title>
<style>
  :root {
    --accent: #d9ff3a;
    --bg: #0a0a0a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: #fff;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
    padding: 24px 16px 48px;
  }
  h1 {
    font-size: 1.1rem;
    letter-spacing: 0.15em;
    text-transform: uppercase;
    color: var(--accent);
    margin: 0 0 4px;
  }
  p.sub {
    color: #999;
    font-size: 0.85rem;
    margin: 0 0 18px;
    text-align: center;
    max-width: 420px;
  }
  .stage {
    position: relative;
    width: min(90vw, 560px);
    aspect-ratio: 4 / 3;
    border-radius: 16px;
    overflow: hidden;
    background: #111;
    box-shadow: 0 0 0 1px rgba(255,255,255,0.08);
  }
  video { display: none; }
