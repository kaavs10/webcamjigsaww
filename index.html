<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >
  <title>Ocean Jigsaw 🫧</title>


  <style>

    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        Arial,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #e9fbff 0%,
          #c8f2fb 45%,
          #8bd9ed 100%
        );

    }


    body {

      position: relative;

    }


    /* =========================================
       MAIN STAGE
    ========================================= */

    #stage {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #e9fbff,
          #c8f2fb,
          #8bd9ed
        );

    }


    #stage.puzzle-mode {

      background:
        linear-gradient(
          135deg,
          #e9fbff 0%,
          #c5f1fb 50%,
          #87d7ed 100%
        );

    }


    video {

      display: none;

    }


    canvas {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

    }


    /* =========================================
       TOP BAR
    ========================================= */

    .top-bar {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      z-index: 20;

      padding:
        16px
        20px
        10px;

      text-align: center;

      pointer-events: none;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.75),
          rgba(255,255,255,0)
        );

    }


    .top-bar h1 {

      margin: 0 0 4px;

      color: #075985;

      font-size: 1rem;

      letter-spacing: 0.16em;

      text-transform: uppercase;

    }


    .top-bar p {

      margin: 0 auto;

      color: #164e63;

      font-size: 0.78rem;

      max-width: 550px;

    }


    /* =========================================
       TIMER
    ========================================= */

    .timer {

      position: fixed;

      top: 18px;
      right: 20px;

      z-index: 30;

      display: none;

      padding:
        9px
        15px;

      border-radius: 999px;

      background:
        rgba(255,255,255,0.82);

      color: #075985;

      font-size: 1rem;

      font-weight: 800;

      letter-spacing: 0.04em;

      font-variant-numeric:
        tabular-nums;

      box-shadow:
        0 5px 20px
        rgba(7,89,133,0.15);

      backdrop-filter:
        blur(10px);

    }


    /* =========================================
       BUTTON BAR
    ========================================= */

    .bottom-bar {

      position: fixed;

      left: 0;
      right: 0;

      bottom: 22px;

      z-index: 30;

      display: flex;

      justify-content: center;

      align-items: center;

      gap: 10px;

    }


    button {

      border: none;

      padding:
        13px
        23px;

      border-radius: 999px;

      background:
        rgba(255,255,255,0.94);

      color: #075985;

      font-size: 0.9rem;

      font-weight: 750;

      cursor: pointer;

      box-shadow:
        0 6px 20px
        rgba(7,89,133,0.18);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

    }


    button:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 9px 25px
        rgba(7,89,133,0.23);

    }


    button:active {

      transform:
        translateY(0);

    }


    button.secondary {

      background:
        rgba(255,255,255,0.55);

      border:
        1px solid
        rgba(7,89,133,0.3);

    }


    button:disabled {

      opacity: 0.4;

      cursor: not-allowed;

    }


    /* =========================================
       START / RESULT POPUP
    ========================================= */

    .modal {

      position: fixed;

      inset: 0;

      z-index: 100;

      display: flex;

      align-items: center;

      justify-content: center;

      padding: 20px;

      background:
        rgba(7,89,133,0.25);

      backdrop-filter:
        blur(12px);

    }


    .card {

      width:
        min(400px, 92vw);

      padding:
        32px 28px;

      border-radius: 28px;

      text-align: center;

      background:
        rgba(255,255,255,0.95);

      box-shadow:
        0 25px 70px
        rgba(7,89,133,0.25);

    }


    .card-icon {

      font-size: 2.8rem;

      margin-bottom: 8px;

    }


    .card h2 {

      margin:
        0 0 8px;

      color: #075985;

      font-size: 1.6rem;

    }


    .card p {

      color: #164e63;

      font-size: 0.9rem;

      line-height: 1.5;

    }


    #playerName {

      width: 100%;

      padding:
        13px 16px;

      margin:
        8px 0 12px;

      border-radius: 14px;

      border:
        1.5px solid
        rgba(7,89,133,0.25);

      outline: none;

      background:
        #e8faff;

      color: #075985;

      font-size: 1rem;

      text-align: center;

    }


    #playerName:focus {

      border-color:
        #38a8ca;

      box-shadow:
        0 0 0 3px
        rgba(56,168,202,0.15);

    }


    #startGame {

      width: 100%;

    }


    /* =========================================
       SCOREBOARD
    ========================================= */

    .scoreboard {

      position: fixed;

      top: 70px;

      left: 16px;

      z-index: 25;

      width:
        min(270px, 38vw);

      max-height: 45vh;

      overflow-y: auto;

      padding:
        14px;

      border-radius: 20px;

      background:
        rgba(255,255,255,0.68);

      border:
        1px solid
        rgba(255,255,255,0.85);

      box-shadow:
        0 8px 28px
        rgba(7,89,133,0.12);

      backdrop-filter:
        blur(12px);

      color: #075985;

    }


    .score-title {

      margin-bottom: 8px;

      font-size: 0.88rem;

      font-weight: 800;

    }


    .score-row {

      display: grid;

      grid-template-columns:
        25px 1fr auto;

      gap: 7px;

      align-items: center;

      padding:
        7px 0;

      border-bottom:
        1px solid
        rgba(7,89,133,0.08);

      font-size: 0.75rem;

    }


    .score-row:last-child {

      border-bottom: none;

    }


    .score-name {

      overflow: hidden;

      text-overflow: ellipsis;

      white-space: nowrap;

      font-weight: 700;

    }


    .score-time {

      font-weight: 800;

      font-variant-numeric:
        tabular-nums;

    }


    .score-date {

      grid-column:
        2 / 4;

      font-size: 0.62rem;

      opacity: 0.55;

    }


    @media(max-width:700px) {

      .scoreboard {

        width: 185px;

        left: 8px;

        top: 65px;

      }

    }

  </style>

</head>


<body>


  <!-- =========================================

  <!-- =========================================
       JAVASCRIPT
  ========================================== -->

  <script type="module">


    /* =========================================
       MEDIAPIPE IMPORT
    ========================================== */

    import {

      HandLandmarker,

      FilesetResolver

    }

    from

      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";


    /* =========================================
       ELEMENTS
    ========================================== */

    const video =
      document.getElementById(
        "video"
      );


    const canvas =
      document.getElementById(
        "canvas"
      );


    const ctx =
      canvas.getContext(
        "2d"
      );


    const stage =
      document.getElementById(
        "stage"
      );


    const instructions =
      document.getElementById(
        "instructions"
      );


    const timer =
      document.getElementById(
        "timer"
      );


    const captureControls =
      document.getElementById(
        "captureControls"
      );


    const cropControls =
      document.getElementById(
        "cropControls"
      );


    const puzzleControls =
      document.getElementById(
        "puzzleControls"
      );


    const captureBtn =
      document.getElementById(
        "captureBtn"
      );


    const confirmCrop =
      document.getElementById(
        "confirmCrop"
      );


    const cancelCrop =
      document.getElementById(
        "cancelCrop"
      );


    const undoBtn =
      document.getElementById(
        "undoBtn"
      );


    const shuffleBtn =
      document.getElementById(
        "shuffleBtn"
      );


    const retakeBtn =
      document.getElementById(
        "retakeBtn"
      );


    const nameModal =
      document.getElementById(
        "nameModal"
      );


    const playerNameInput =
      document.getElementById(
        "playerName"
      );


    const startGame =
      document.getElementById(
        "startGame"
      );


    const resultModal =
      document.getElementById(
        "resultModal"
      );


    const resultIcon =
      document.getElementById(
        "resultIcon"
      );


    const resultTitle =
      document.getElementById(
        "resultTitle"
      );


    const resultDetails =
      document.getElementById(
        "resultDetails"
      );


    const scoreList =
      document.getElementById(
        "scoreList"
      );


    /* =========================================
       SETTINGS
    ========================================== */

    const GRID =
      3;


    const ROUND_TIME =
      60 * 1000;


    const AUTO_RESTART =
      3 * 60 * 1000;


    /* =========================================
       GAME STATE
    ========================================== */

    let phase =
      "preview";


    let playerName =
      localStorage.getItem(
        "oceanJigsawPlayerName"
      ) || "";


    let tileCanvases =
      [];


    let order =
      [];


    let heldTile =
      null;


    let moveHistory =
      [];


    let solvedShown =
      false;


    let resultShown =
      false;


    let roundStarted =
      false;


    let timerStart =
      0;


    let timerInterval =
      null;


    let restartTimeout =
      null;


    /* =========================================
       CANVAS SIZE
    ========================================== */

    let W =
      window.innerWidth;


    let H =
      window.innerHeight;


    function resizeCanvas() {

      W =
        window.innerWidth;

      H =
        window.innerHeight;

      canvas.width =
        W;

      canvas.height =
        H;

    }


    resizeCanvas();


    /* =========================================
       CROP
    ========================================== */

    let crop = {

      x: 0,

      y: 0,

      w: 0,

      h: 0

    };


    let cropGrab =
      null;


    let previousPinch =
      false;


    let twoHandTimer =
      false;


    let twoHandStart =
      0;


    const CROP_HOLD =
      5000;


    function defaultCrop() {

      const size =
        Math.min(W, H) * 0.82;


      crop = {

        x:
          (W - size) / 2,

        y:
          (H - size) / 2,

        w:
          size,

        h:
          size

      };

    }


    function clampCrop() {

      const minSize =
        Math.min(W, H) * 0.18;


      crop.w =
        Math.max(
          minSize,
          Math.min(
            crop.w,
            W
          )
        );


      crop.h =
        Math.max(
          minSize,
          Math.min(
            crop.h,
            H
          )
        );


      crop.x =
        Math.max(
          0,
          Math.min(
            crop.x,
            W - crop.w
          )
        );


      crop.y =
        Math.max(
          0,
          Math.min(
            crop.y,
            H - crop.h
          )
        );

    }


    /* =========================================
       BUBBLES
    ========================================== */

    const bubbles =
      [];


    function createBubbles() {

      bubbles.length =
        0;


      const amount =
        Math.min(
          40,
          Math.floor(
            W / 28
          )
        );


      for (
        let i = 0;
        i < amount;
        i++
      ) {

        bubbles.push({

          x:
            Math.random() * W,

          y:
            Math.random() * H,

          r:
            5 +
            Math.random() * 23,

          speed:
            0.25 +
            Math.random() * 0.8,

          wobble:
            Math.random() * Math.PI * 2,

          alpha:
            0.12 +
            Math.random() * 0.25

        });

      }

    }


    createBubbles();


    function drawBubbles() {

      for (
        const b of bubbles
      ) {

        b.y -=
          b.speed;


        b.wobble +=
          0.015;


        const x =
          b.x +
          Math.sin(
            b.wobble
          ) * 12;


        if (
          b.y <
          -b.r * 2
        ) {

          b.y =
            H +
            b.r * 2;

        }


        ctx.beginPath();


        ctx.arc(
          x,
          b.y,
          b.r,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          `rgba(
            255,
            255,
            255,
            ${b.alpha * 0.5}
          )`;


        ctx.fill();


        ctx.strokeStyle =
          `rgba(
            255,
            255,
            255,
            ${b.alpha}
          )`;


        ctx.lineWidth =
          1.2;


        ctx.stroke();

      }

    }


    /* =========================================
       CAMERA TRANSFORM
    ========================================== */

    function getTransform() {

      const vw =
        video.videoWidth ||
        640;


      const vh =
        video.videoHeight ||
        480;


      const scale =
        Math.max(
          W / vw,
          H / vh
        );


      const dw =
        vw * scale;


      const dh =
        vh * scale;


      return {

        vw,

        vh,

        scale,

        dw,

        dh,

        ox:
          (W - dw) / 2,

        oy:
          (H - dh) / 2

      };

    }


    /* =========================================
       MIRRORED CAMERA
    ========================================== */

    function drawCamera(
      target
    ) {

      const t =
        getTransform();


      /*
        THIS is the lateral
        inversion fix.

        The video itself is mirrored.
      */

      target.save();


      target.translate(
        W,
        0
      );


      target.scale(
        -1,
        1
      );


      target.drawImage(

        video,

        t.ox,

        t.oy,

        t.dw,

        t.dh

      );


      target.restore();

    }


    /* =========================================
       MIRRORED HAND COORDINATES
    ========================================== */

    function landmarkToCanvas(
      landmark
    ) {

      const t =
        getTransform();


      /*
        MediaPipe's original
        X coordinate is reversed
        because our camera is
        mirrored.

        (1 - x) fixes this.
      */

      return {

        x:
          t.ox +
          (1 - landmark.x) *
          t.vw *
          t.scale,

        y:
          t.oy +
          landmark.y *
          t.vh *
          t.scale

      };

    }


    function distance(
      a,
      b
    ) {

      return Math.hypot(

        a.x - b.x,

        a.y - b.y

      );

    }


    /* =========================================
       PROCESS HAND
    ========================================== */

    function processHand(
      landmarks
    ) {

      const thumb =
        landmarkToCanvas(
          landmarks[4]
        );


      const index =
        landmarkToCanvas(
          landmarks[8]
        );


      const wrist =
        landmarkToCanvas(
          landmarks[0]
        );


      const middle =
        landmarkToCanvas(
          landmarks[9]
        );


      const scale =
        Math.max(
          distance(
            wrist,
            middle
          ),
          20
        );


      /*
        Pinch is detected when
        thumb + index are close.
      */

      const pinching =
        distance(
          thumb,
          index
        ) <
        scale * 0.60;


      return {

        landmarks,

        thumb,

        index,

        wrist,

        pinching,

        pinchPoint: {

          x:
            (thumb.x +
             index.x) / 2,

          y:
            (thumb.y +
             index.y) / 2

        }

      };

    }


    /* =========================================
       DRAW HAND
    ========================================== */

    function drawHand(
      landmarks
    ) {

      const connections = [

        [0,1],
        [1,2],
        [2,3],
        [3,4],

        [0,5],
        [5,6],
        [6,7],
        [7,8],

        [5,9],
        [9,10],
        [10,11],
        [11,12],

        [9,13],
        [13,14],
        [14,15],
        [15,16],

        [13,17],
        [17,18],
        [18,19],
        [19,20],

        [0,17]

      ];


      ctx.strokeStyle =
        "rgba(7,89,133,0.85)";


      ctx.lineWidth =
        2;


      ctx.beginPath();


      for (
        const [a,b]
        of connections
      ) {

        const p1 =
          landmarkToCanvas(
            landmarks[a]
          );


        const p2 =
          landmarkToCanvas(
            landmarks[b]
          );


        ctx.moveTo(
          p1.x,
          p1.y
        );


        ctx.lineTo(
          p2.x,
          p2.y
        );

      }


      ctx.stroke();


      for (
        const lm
        of landmarks
      ) {

        const p =
          landmarkToCanvas(
            lm
          );


        ctx.beginPath();


        ctx.arc(
          p.x,
          p.y,
          2.5,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          "#ffffff";


        ctx.fill();

      }

    }


    /* =========================================
       CROP RECTANGLE
    ========================================== */

    function drawCrop() {

      ctx.fillStyle =
        "rgba(7,89,133,0.25)";


      ctx.fillRect(
        0,
        0,
        W,
        crop.y
      );


      ctx.fillRect(

        0,

        crop.y +
        crop.h,

        W,

        H -
        crop.y -
        crop.h

      );


      ctx.fillRect(

        0,

        crop.y,

        crop.x,

        crop.h

      );


      ctx.fillRect(

        crop.x +
        crop.w,

        crop.y,

        W -
        crop.x -
        crop.w,

        crop.h

      );


      ctx.strokeStyle =
        "#ffffff";


      ctx.lineWidth =
        3;


      ctx.strokeRect(

        crop.x,

        crop.y,

        crop.w,

        crop.h

      );


      const corners = [

        [crop.x, crop.y],

        [
          crop.x +
          crop.w,
          crop.y
        ],

        [
          crop.x,
          crop.y +
          crop.h
        ],

        [
          crop.x +
          crop.w,
          crop.y +
          crop.h
        ]

      ];


      for (
        const [x,y]
        of corners
      ) {

        ctx.beginPath();


        ctx.arc(
          x,
          y,
          13,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          "#ffffff";


        ctx.fill();

      }

    }


    /* =========================================
       GRID
    ========================================== */

    function getCell(
      pos
    ) {

      const col =
        pos % GRID;


      const row =
        Math.floor(
          pos / GRID
        );


      return {

        x:
          crop.x +
          col *
          crop.w /
          GRID,

        y:
          crop.y +
          row *
          crop.h /
          GRID,

        w:
          crop.w /
          GRID,

        h:
          crop.h /
          GRID

      };

    }


    function positionAt(
      x,
      y
    ) {

      if (

        x < crop.x ||

        y < crop.y ||

        x >=
        crop.x +
        crop.w ||

        y >=
        crop.y +
        crop.h

      ) {

        return -1;

      }


      const col =
        Math.floor(

          (
            x -
            crop.x
          ) /
          (
            crop.w /
            GRID
          )

        );


      const row =
        Math.floor(

          (
            y -
            crop.y
          ) /
          (
            crop.h /
            GRID
          )

        );


      return (
        row *
        GRID +
        col
      );

    }


    /* =========================================
       CREATE PUZZLE
    ========================================== */

    function createPuzzle(
      source
    ) {

      tileCanvases =
        [];


      const tileW =
        crop.w /
        GRID;


      const tileH =
        crop.h /
        GRID;


      for (
        let i = 0;
        i < GRID * GRID;
        i++
      ) {

        const col =
          i % GRID;


        const row =
          Math.floor(
            i / GRID
          );


        const tile =
          document.createElement(
            "canvas"
          );


        tile.width =
          tileW;


        tile.height =
          tileH;


        const tileCtx =
          tile.getContext(
            "2d"
          );


        tileCtx.drawImage(

          source,

          crop.x +
          col * tileW,

          crop.y +
          row * tileH,

          tileW,

          tileH,

          0,

          0,

          tileW,

          tileH

        );


        tileCanvases.push(
          tile
        );

      }

    }


    /* =========================================
       SHUFFLE
    ========================================== */

    function shufflePuzzle() {

      order =
        [
          ...Array(
            GRID * GRID
          ).keys()
        ];


      do {

        for (
          let i =
            order.length - 1;

          i > 0;

          i--

        ) {

          const j =
            Math.floor(
              Math.random() *
              (i + 1)
            );


          [
            order[i],
            order[j]
          ] =
          [
            order[j],
            order[i]
          ];

        }

      }

      while (
        isSolved()
      );


      heldTile =
        null;


      moveHistory =
        [];


      solvedShown =
        false;


      updateUndo();

    }


    function isSolved() {

      return order.every(

        (
          value,
          index
        ) =>
          value === index

      );

    }


    /* =========================================
       SCOREBOARD
    ========================================== */

    const SCORE_KEY =
      "oceanJigsawScores";


    function getScores() {

      try {

        const saved =
          localStorage.getItem(
            SCORE_KEY
          );


        if (!saved)
          return [];


        const data =
          JSON.parse(
            saved
          );


        return Array.isArray(data)
          ? data
          : [];

      }

      catch {

        return [];

      }

    }


    function saveScores(
      scores
    ) {

      localStorage.setItem(

        SCORE_KEY,

        JSON.stringify(
          scores
        )

      );

    }


    function formatTime(
      milliseconds
    ) {

      const seconds =
        Math.ceil(
          milliseconds /
          1000
        );


      const mins =
        Math.floor(
          seconds / 60
        );


      const secs =
        seconds % 60;


      return (

        String(mins)
          .padStart(2,"0")

        +

        ":"

        +

        String(secs)
          .padStart(2,"0")

      );

    }


    function escapeHTML(
      value
    ) {

      return String(value)

        .replace(
          /&/g,
          "&amp;"
        )

        .replace(
          /</g,
          "&lt;"
        )

        .replace(
          />/g,
          "&gt;"
        )

        .replace(
          /"/g,
          "&quot;"
        )

        .replace(
          /'/g,
          "&#039;"
        );

    }


    function renderScoreboard() {

      const scores =
        getScores();


      if (
        scores.length === 0
      ) {

        scoreList.textContent =
          "No scores yet.";

        return;

      }


      scoreList.innerHTML =

        scores
          .slice(0,10)
          .map(

            (
              score,
              index
            ) => {

              const date =
                score.date
                  ? new Date(
                      score.date
                    )
                    .toLocaleDateString()
                  : "";


              return `

                <div
                  class="score-row"
                >

                  <span>
                    ${index + 1}
                  </span>

                  <span
                    class="score-name"
                  >
                    ${escapeHTML(
                      score.name
                    )}
                  </span>

                  <span
                    class="score-time"
                  >
                    ${escapeHTML(
                      score.time
                    )}
                  </span>

                  <span
                    class="score-date"
                  >
                    ${escapeHTML(
                      date
                    )}
                  </span>

                </div>

              `;

            }

          )

          .join("");

    }


    function addScore(
      milliseconds
    ) {

      const scores =
        getScores();


      scores.push({

        name:
          playerName ||
          "Player",

        time:
          formatTime(
            milliseconds
          ),

        milliseconds,

        date:
          new Date()
            .toISOString()

      });


      scores.sort(

        (a,b) =>
          a.milliseconds -
          b.milliseconds

      );


      saveScores(

        scores.slice(
          0,
          50
        )

      );


      renderScoreboard();

    }


    /* =========================================
       TIMER
    ========================================== */

    function startTimer() {

      stopTimer();


      timerStart =
        Date.now();


      roundStarted =
        true;


      timer.style.display =
        "block";


      updateTimer();


      timerInterval =
        setInterval(
          updateTimer,
          100
        );

    }


    function stopTimer() {

      if (
        timerInterval
      ) {

        clearInterval(
          timerInterval
        );


        timerInterval =
          null;

      }

    }


    function updateTimer() {

      if (
        !roundStarted
      ) {

        timer.textContent =
          "01:00";

        return;

      }


      const elapsed =
        Date.now() -
        timerStart;


      const remaining =
        Math.max(

          0,

          ROUND_TIME -
          elapsed

        );


      timer.textContent =
        formatTime(
          remaining
        );


      if (

        remaining <= 0 &&

        !resultShown

      ) {

        showLoss();

      }

    }


    /* =========================================
       WIN
    ========================================== */

    function showWin() {

      if (
        resultShown
      )
        return;


      resultShown =
        true;


      roundStarted =
        false;


      stopTimer();


      const elapsed =
        Math.min(

          ROUND_TIME,

          Date.now() -
          timerStart

        );


      addScore(
        elapsed
      );


      resultIcon.textContent =
        "🎉";


      resultTitle.textContent =
        "you've won a prize";


      resultDetails.textContent =

        `${playerName || "Player"} solved the puzzle in ${formatTime(elapsed)}.`;


      resultModal.style.display =
        "flex";


      scheduleRestart();

    }


    /* =========================================
       LOSS
    ========================================== */

    function showLoss() {

      if (
        resultShown
      )
        return;


      resultShown =
        true;


      roundStarted =
        false;


      stopTimer();


      resultIcon.textContent =
        "😢";


      resultTitle.textContent =
        "oh no you've lost";


      resultDetails.textContent =
        "Time's up!";


      resultModal.style.display =
        "flex";


      scheduleRestart();

    }


    /* =========================================
       AUTO RESTART
    ========================================== */

    function scheduleRestart() {

      if (
        restartTimeout
      ) {

        clearTimeout(
          restartTimeout
        );

      }


      restartTimeout =
        setTimeout(

          restartGame,

          AUTO_RESTART

        );

    }


    function restartGame() {

      if (
        restartTimeout
      ) {

        clearTimeout(
          restartTimeout
        );


        restartTimeout =
          null;

      }


      resultModal.style.display =
        "none";


      phase =
        "preview";


      roundStarted =
        false;


      resultShown =
        false;


      solvedShown =
        false;


      heldTile =
        null;


      moveHistory =
        [];


      timer.style.display =
        "none";


      captureControls.style.display =
        "flex";


      cropControls.style.display =
        "none";


      puzzleControls.style.display =
        "none";


      stage.classList.remove(
        "puzzle-mode"
      );


      instructions.textContent =

        `New round! ${playerName || "Player"}, frame yourself and capture.`;


      createBubbles();

    }


    /* =========================================
       CAPTURE PHOTO
    ========================================== */

    function capturePhoto() {

      const photo =
        document.createElement(
          "canvas"
        );


      photo.width =
        W;


      photo.height =
        H;


      const photoCtx =
        photo.getContext(
          "2d"
        );


      /*
        IMPORTANT:
        Save the MIRRORED camera image.

        This makes the puzzle match
        what the player saw.
      */

      drawCamera(
        photoCtx
      );


      createPuzzle(
        photo
      );


      shufflePuzzle();


      phase =
        "puzzle";


      roundStarted =
        true;


      resultShown =
        false;


      stage.classList.add(
        "puzzle-mode"
      );


      captureControls.style.display =
        "none";


      cropControls.style.display =
        "none";


      puzzleControls.style.display =
        "flex";


      instructions.textContent =
        "✋ Pinch a puzzle piece and move it onto another piece.";


      startTimer();

    }


    /* =========================================
       CROP PHASE
    ========================================== */

    function enterCrop() {

      phase =
        "crop";


      defaultCrop();


      previousPinch =
        false;


      cropGrab =
        null;


      captureControls.style.display =
        "none";


      cropControls.style.display =
        "flex";


      instructions.textContent =
        "Adjust the crop using your hand, then confirm.";

    }


    /* =========================================
       PREVIEW
    ========================================== */

    function backToPreview() {

      phase =
        "preview";


      roundStarted =
        false;


      resultShown =
        false;


      stopTimer();


      timer.style.display =
        "none";


      heldTile =
        null;


      captureControls.style.display =
        "flex";


      cropControls.style.display =
        "none";


      puzzleControls.style.display =
        "none";


      stage.classList.remove(
        "puzzle-mode"
      );


      instructions.textContent =
        `Good luck, ${playerName || "Player"}! Frame yourself and capture.`;

    }


    /* =========================================
       UNDO
    ========================================== */

    function updateUndo() {

      undoBtn.disabled =
        moveHistory.length === 0;

    }


    function undoMove() {

      if (

        moveHistory.length === 0 ||

        resultShown

      )
        return;


      const move =
        moveHistory.pop();


      [
        order[
          move.from
        ],

        order[
          move.to
        ]

      ] =
      [

        order[
          move.to
        ],

        order[
          move.from
        ]

      ];


      heldTile =
        null;


      updateUndo();

    }


    /* =========================================
       HAND CROP
    ========================================== */

    function handleCrop(
      hands
    ) {

      /*
        Two-hand crop:

        Pinch both hands and use them
        as opposite corners.
      */

      if (

        hands.length >= 2 &&

        hands[0].pinching &&

        hands[1].pinching

      ) {

        const p1 =
          hands[0].pinchPoint;


        const p2 =
          hands[1].pinchPoint;


        crop = {

          x:
            Math.min(
              p1.x,
              p2.x
            ),

          y:
            Math.min(
              p1.y,
              p2.y
            ),

          w:
            Math.abs(
              p1.x -
              p2.x
            ),

          h:
            Math.abs(
              p1.y -
              p2.y
            )

        };


        clampCrop();


        if (
          !twoHandTimer
        ) {

          twoHandTimer =
            true;


          twoHandStart =
            performance.now();

        }


        if (

          performance.now() -
          twoHandStart >=
          CROP_HOLD

        ) {

          capturePhoto();

        }


        return;

      }


      twoHandTimer =
        false;


      const hand =
        hands[0];


      if (!hand) {

        previousPinch =
          false;

        cropGrab =
          null;

        return;

      }


      const point =
        hand.pinchPoint;


      if (

        hand.pinching &&

        !previousPinch

      ) {

        const corners = {

          tl: {
            x: crop.x,
            y: crop.y
          },

          tr: {
            x:
              crop.x +
              crop.w,

            y:
              crop.y
          },

          bl: {
            x:
              crop.x,

            y:
              crop.y +
              crop.h
          },

          br: {
            x:
              crop.x +
              crop.w,

            y:
              crop.y +
              crop.h
          }

        };


        let mode =
          null;


        for (
          const key
          in corners
        ) {

          if (

            distance(
              point,
              corners[key]
            ) < 30

          ) {

            mode =
              key;

            break;

          }

        }


        if (!mode) {

          if (

            point.x >
            crop.x &&

            point.x <
            crop.x +
            crop.w &&

            point.y >
            crop.y &&

            point.y <
            crop.y +
            crop.h

          ) {

            mode =
              "move";

          }

        }


        if (mode) {

          cropGrab = {

            mode,

            startX:
              point.x,

            startY:
              point.y,

            original:
              {
                ...crop
              }

          };

        }

      }


      if (

        hand.pinching &&

        previousPinch &&

        cropGrab

      ) {

        const dx =
          point.x -
          cropGrab.startX;


        const dy =
          point.y -
          cropGrab.startY;


        const original =
          cropGrab.original;


        if (
          cropGrab.mode ===
          "move"
        ) {

          crop.x =
            original.x +
            dx;


          crop.y =
            original.y +
            dy;

        }


        if (
          cropGrab.mode ===
          "tl"
        ) {

          crop.x =
            original.x +
            dx;


          crop.y =
            original.y +
            dy;


          crop.w =
            original.w -
            dx;


          crop.h =
            original.h -
            dy;

        }


        if (
          cropGrab.mode ===
          "tr"
        ) {

          crop.y =
            original.y +
            dy;


          crop.w =
            original.w +
            dx;


          crop.h =
            original.h -
            dy;

        }


        if (
          cropGrab.mode ===
          "bl"
        ) {

          crop.x =
            original.x +
            dx;


          crop.w =
            original.w -
            dx;


          crop.h =
            original.h +
            dy;

        }


        if (
          cropGrab.mode ===
          "br"
        ) {

          crop.w =
            original.w +
            dx;


          crop.h =
            original.h +
            dy;

        }


        clampCrop();

      }


      if (

        !hand.pinching &&

        previousPinch

      ) {

        cropGrab =
          null;

      }


      previousPinch =
        hand.pinching;

    }


    /* =========================================
       PUZZLE HAND CONTROL
    ========================================== */

    let cursor = {

      x: 0,

      y: 0,

      visible: false

    };


    function handlePuzzle(
      hand
    ) {

      if (!hand) {

        cursor.visible =
          false;


        previousPinch =
          false;


        return;

      }


      cursor.x =
        hand.pinchPoint.x;


      cursor.y =
        hand.pinchPoint.y;


      cursor.visible =
        true;


      const pinching =
        hand.pinching;


      /*
        PINCH DOWN
        = pick up piece
      */

      if (

        pinching &&

        !previousPinch

      ) {

        const pos =
          positionAt(

            cursor.x,

            cursor.y

          );


        if (

          pos !== -1 &&

          !heldTile

        ) {

          heldTile = {

            tileId:
              order[pos],

            from:
              pos

          };

        }

      }


      /*
        RELEASE
        = drop/swap
      */

      if (

        !pinching &&

        previousPinch &&

        heldTile

      ) {

        const destination =
          positionAt(

            cursor.x,

            cursor.y

          );


        if (

          destination !== -1 &&

          destination !==
          heldTile.from

        ) {

          [
            order[
              destination
            ],

            order[
              heldTile.from
            ]

          ] =
          [

            order[
              heldTile.from
            ],

            order[
              destination
            ]

          ];


          moveHistory.push({

            from:
              heldTile.from,

            to:
              destination

          });


          updateUndo();

        }


        heldTile =
          null;

      }


      previousPinch =
        pinching;

    }


    /* =========================================
       RENDER
    ========================================== */

    function render() {

      ctx.clearRect(
        0,
        0,
        W,
        H
      );


      /*
        CAMERA
      */

      if (

        phase ===
        "preview" ||

        phase ===
        "crop"

      ) {

        drawCamera(
          ctx
        );


        if (
          phase ===
          "crop"
        ) {

          drawCrop();

        }

      }


      /*
        PUZZLE
      */

      else {

        drawBubbles();


        for (
          let pos = 0;
          pos < order.length;
          pos++
        ) {

          const tileId =
            order[pos];


          if (

            heldTile &&

            heldTile.tileId ===
            tileId

          ) {

            continue;

          }


          const cell =
            getCell(
              pos
            );


          ctx.drawImage(

            tileCanvases[
              tileId
            ],

            cell.x,

            cell.y,

            cell.w,

            cell.h

          );

        }


        /*
          Grid lines
        */

        ctx.strokeStyle =
          "rgba(255,255,255,0.7)";


        ctx.lineWidth =
          1;


        for (
          let i = 1;
          i < GRID;
          i++
        ) {

          const x =
            crop.x +
            crop.w /
            GRID *
            i;


          const y =
            crop.y +
            crop.h /
            GRID *
            i;


          ctx.beginPath();


          ctx.moveTo(
            x,
            crop.y
          );


          ctx.lineTo(
            x,
            crop.y +
            crop.h
          );


          ctx.stroke();


          ctx.beginPath();


          ctx.moveTo(
            crop.x,
            y
          );


          ctx.lineTo(
            crop.x +
            crop.w,
            y
          );


          ctx.stroke();

        }


        /*
          Held piece
        */

        if (

          heldTile &&

          cursor.visible

        ) {

          const cw =
            crop.w /
            GRID;


          const ch =
            crop.h /
            GRID;


          ctx.save();


          ctx.shadowColor =
            "rgba(7,89,133,0.35)";


          ctx.shadowBlur =
            20;


          ctx.drawImage(

            tileCanvases[
              heldTile.tileId
            ],

            cursor.x -
            cw * 0.54,

            cursor.y -
            ch * 0.54,

            cw * 1.08,

            ch * 1.08

          );


          ctx.restore();

        }


        /*
          Win check
        */

        if (

          isSolved() &&

          !solvedShown

        ) {

          solvedShown =
            true;


          showWin();

        }

      }


      /*
        Draw hand tracking
      */

      for (
        const hand
        of detectedHands
      ) {

        drawHand(
          hand.landmarks
        );

      }


      /*
        Hand cursor
      */

      if (

        cursor.visible &&

        phase ===
        "puzzle"

      ) {

        ctx.beginPath();


        ctx.arc(

          cursor.x,

          cursor.y,

          11,

          0,

          Math.PI * 2

        );


        ctx.strokeStyle =
          "#ffffff";


        ctx.lineWidth =
          3;


        ctx.stroke();

      }

    }


    /* =========================================
       MEDIAPIPE
    ========================================== */

    let handLandmarker =
      null;


    let detectedHands =
      [];


    let detectionBusy =
      false;


    let lastVideoTime =
      -1;


    let frameNumber =
      0;


    async function setupHandTracking() {

      try {

        instructions.textContent =
          "Loading hand tracking…";


        /*
          Load MediaPipe WASM.
        */

        const vision =
          await FilesetResolver
            .forVisionTasks(

              "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"

            );


        /*
          Create hand detector.
        */

        handLandmarker =
          await HandLandmarker
            .createFromOptions(

              vision,

              {

                baseOptions: {

                  modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                  delegate:
                    "CPU"

                },


                runningMode:
                  "VIDEO",


                numHands:
                  2,


                minHandDetectionConfidence:
                  0.35,


                minHandPresenceConfidence:
                  0.35,


                minTrackingConfidence:
                  0.35

              }

            );


        instructions.textContent =
          "✋ Hand tracking ready — pinch your thumb + index finger.";

      }

      catch (error) {

        console.error(
          "MediaPipe error:",
          error
        );


        instructions.textContent =
          "❌ Hand tracking failed to load. Refresh the page.";

      }

    }


    /* =========================================
       CAMERA LOOP
    ========================================== */

    async function cameraLoop() {

      render();


      if (

        !handLandmarker ||

        detectionBusy ||

        !video.videoWidth

      ) {

        requestAnimationFrame(
          cameraLoop
        );


        return;

      }


      /*
        Every second frame.
      */

      if (
        frameNumber++ % 2
      ) {

        requestAnimationFrame(
          cameraLoop
        );


        return;

      }


      const currentTime =
        video.currentTime;


      if (

        !Number.isFinite(
          currentTime
        ) ||

        currentTime <=
        lastVideoTime

      ) {

        requestAnimationFrame(
          cameraLoop
        );


        return;

      }


      lastVideoTime =
        currentTime;


      detectionBusy =
        true;


      try {

        const timestamp =
          Math.round(
            currentTime *
            1000
          );


        const result =
          handLandmarker
            .detectForVideo(

              video,

              timestamp

            );


        detectedHands =
          (
            result.landmarks ||
            []
          ).map(
            processHand
          );


        if (
          phase ===
          "crop"
        ) {

          handleCrop(
            detectedHands
          );

        }


        if (

          phase ===
          "puzzle" &&

          !resultShown

        ) {

          handlePuzzle(
            detectedHands[0] ||
            null
          );

        }

      }

      catch (error) {

        console.error(
          "Detection error:",
          error
        );

      }


      detectionBusy =
        false;


      requestAnimationFrame(
        cameraLoop
      );

    }

      backToPreview

    );


    undoBtn.addEventListener(

      "click",

      undoMove

    );


    shuffleBtn.addEventListener(

      "click",

      () => {

        if (
          !roundStarted
        )
          return;


        shufflePuzzle();


        /*
          Shuffle gives a fresh
          one-minute attempt.
        */

        timerStart =
          Date.now();


        instructions.textContent =
          "Shuffled! You have 1 minute.";

      }

    );


    /* =========================================
       NAME POPUP
    ========================================== */

    function startWithName() {

      const name =
        playerNameInput
          .value
          .trim();


      if (!name) {

        playerNameInput.focus();

        return;

      }


      playerName =
        name.slice(
          0,
          20
        );


      localStorage.setItem(

        "oceanJigsawPlayerName",

        playerName

      );


      nameModal.style.display =
        "none";


      instructions.textContent =

        `Good luck, ${playerName}! Frame yourself and capture.`;

    }


    startGame.addEventListener(

      "click",

      startWithName

    );


    playerNameInput.addEventListener(

      "keydown",

      event => {

        if (
          event.key ===
          "Enter"
        ) {

          startWithName();

        }

      }

    );


    /* =========================================
       INITIALISE
    ========================================== */

    renderScoreboard();


    /*
      Always show name popup
      when the game opens.
    */

    if (
      playerName
    ) {

      playerNameInput.value =
        playerName;

    }


    nameModal.style.display =
      "flex";


    /* =========================================
       START CAMERA
    ========================================== */

    async function startCamera() {

      try {

        const stream =

          await navigator
            .mediaDevices
            .getUserMedia({

              video: {

                width: {
                  ideal: 640
                },

                height: {
                  ideal: 480
                },

                facingMode:
                  "user"

              },

              audio:
                false

            });


        video.srcObject =
          stream;


        await video.play();


        await setupHandTracking();


        requestAnimationFrame(
          cameraLoop
        );

      }

      catch (error) {

        console.error(
          "Camera error:",
          error
        );


        instructions.textContent =

          "❌ Camera could not start: " +
          error.message;

      }

    }


    startCamera();


    /* =========================================
       RESIZE
    ========================================== */

    window.addEventListener(

      "resize",

      () => {

        resizeCanvas();


        if (
          phase ===
          "crop"
        ) {

          clampCrop();

        }


        createBubbles();

      }

    );

  </script>

</body>

</html>
