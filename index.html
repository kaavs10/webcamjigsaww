<!DOCTYPE html>
<html lang="en">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0, viewport-fit=cover"
  >

  <title>Ocean Jigsaw — Hand Tracking</title>


  <style>

    :root {
      --blue-dark: #075985;
      --blue-mid: #0e7490;
      --blue-light: #dff7ff;
      --white: #ffffff;
    }


    * {
      box-sizing: border-box;
    }


    html,
    body {

      margin: 0;
      padding: 0;

      width: 100%;
      height: 100%;

      overflow: hidden;

      font-family:
        -apple-system,
        BlinkMacSystemFont,
        "Segoe UI",
        Roboto,
        sans-serif;

      background:
        linear-gradient(
          135deg,
          #e8faff 0%,
          #c8f1fb 45%,
          #8bd8ee 100%
        );

    }


    #stage {

      position: fixed;

      inset: 0;

      width: 100vw;
      height: 100vh;

      overflow: hidden;

      background:
        linear-gradient(
          135deg,
          #e8faff 0%,
          #c8f1fb 45%,
          #8bd8ee 100%
        );

    }


    video {
      display: none;
    }


    canvas {

      position: absolute;

      inset: 0;

      width: 100%;
      height: 100%;

      display: block;

    }


    /*
      Ocean background during puzzle mode
    */

    #stage.puzzle-mode {

      background:

        radial-gradient(
          circle at 15% 20%,
          rgba(255,255,255,0.45),
          transparent 23%
        ),

        radial-gradient(
          circle at 85% 75%,
          rgba(255,255,255,0.3),
          transparent 28%
        ),

        linear-gradient(
          135deg,
          #e8faff 0%,
          #bdeef9 45%,
          #82d3eb 100%
        );

    }


    /* =========================================
       TOP BAR
    ========================================= */

    .top-bar {

      position: fixed;

      top: 0;
      left: 0;
      right: 0;

      padding:
        max(14px, env(safe-area-inset-top))
        16px
        10px;

      text-align: center;

      background:
        linear-gradient(
          to bottom,
          rgba(255,255,255,0.65),
          transparent
        );

      z-index: 10;

      pointer-events: none;

    }


    .top-bar h1 {

      margin: 0 0 4px;

      font-size: 0.95rem;

      letter-spacing: 0.16em;

      text-transform: uppercase;

      color: var(--blue-dark);

      text-shadow:
        0 1px 2px rgba(255,255,255,0.8);

    }


    .top-bar p {

      margin: 0 auto;

      max-width: 520px;

      color: #164e63;

      font-size: 0.78rem;

      font-weight: 500;

    }


    /* =========================================
       TIMER
    ========================================= */

    .timer {

      position: fixed;

      top:
        max(14px, env(safe-area-inset-top));

      right: 16px;

      z-index: 11;

      display: none;

      color: var(--blue-dark);

      font-weight: 700;

      font-size: 1rem;

      letter-spacing: 0.05em;

      font-variant-numeric: tabular-nums;

      padding: 8px 14px;

      border-radius: 999px;

      background:
        rgba(255,255,255,0.72);

      box-shadow:
        0 4px 18px rgba(7,89,133,0.15);

      backdrop-filter:
        blur(10px);

    }


    /* =========================================
       BUTTONS
    ========================================= */

    .bottom-bar {

      position: fixed;

      bottom:
        max(20px, env(safe-area-inset-bottom));

      left: 0;
      right: 0;

      display: flex;

      justify-content: center;

      gap: 10px;

      z-index: 10;

    }


    button {

      border: none;

      padding: 13px 24px;

      border-radius: 999px;

      background:
        rgba(255,255,255,0.92);

      color: var(--blue-dark);

      font-weight: 700;

      font-size: 0.9rem;

      cursor: pointer;

      letter-spacing: 0.02em;

      box-shadow:
        0 5px 18px rgba(7,89,133,0.18);

      backdrop-filter:
        blur(10px);

      transition:
        transform 0.15s ease,
        box-shadow 0.15s ease;

    }


    button:hover {

      transform:
        translateY(-2px);

      box-shadow:
        0 8px 22px rgba(7,89,133,0.23);

    }


    button:active {

      transform:
        translateY(0);

    }


    button.secondary {

      background:
        rgba(255,255,255,0.5);

      color: var(--blue-dark);

      border:
        1.5px solid rgba(7,89,133,0.35);

    }


    button:disabled {

      opacity: 0.4;

      cursor: not-allowed;

    }

  </style>

</head>


<body>


  <!-- =========================================
       UI
  ========================================== -->

  <div class="top-bar">

    <h1>
      Ocean Jigsaw 🫧
    </h1>

    <p id="instructions">
      Starting camera…
    </p>

  </div>


  <div
    class="timer"
    id="timer"
  >
    00:00
  </div>


  <div id="stage">

    <video
      id="video"
      autoplay
      muted
      playsinline
    ></video>

    <canvas id="canvas"></canvas>

  </div>


  <!-- Capture -->

  <div
    class="bottom-bar"
    id="captureBtnWrap"
  >

    <button id="captureBtn">
      📸 Capture Photo
    </button>

  </div>


  <!-- Crop -->

  <div
    class="bottom-bar"
    id="cropControls"
    style="display:none;"
  >

    <button id="confirmCropBtn">
      ✅ Confirm Crop
    </button>

    <button
      class="secondary"
      id="cancelCropBtn"
    >
      ✕ Cancel
    </button>

  </div>


  <!-- Puzzle -->

  <div
    class="bottom-bar"
    id="postControls"
    style="display:none;"
  >

    <button id="undoBtn">
      ↩ Undo
    </button>

    <button id="shuffleBtn">
      🔀 Shuffle
    </button>

    <button
      class="secondary"
      id="retakeBtn"
    >
      ↺ Retake
    </button>

  </div>


  <!-- =========================================
       EVERYTHING BELOW IS JAVASCRIPT
  ========================================== -->

  <script type="module">

    /*
      IMPORTANT:

      We are importing MediaPipe as an ES module.

      This fixes the problem where:

      window.FilesetResolver
      window.HandLandmarker

      were undefined.
    */

    import {
      HandLandmarker,
      FilesetResolver
    }

    from
      "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";


    /* =========================================
       ELEMENTS
    ========================================= */

    const video =
      document.getElementById("video");


    const canvas =
      document.getElementById("canvas");


    const ctx =
      canvas.getContext("2d");


    const stage =
      document.getElementById("stage");


    const instructions =
      document.getElementById("instructions");


    const timerEl =
      document.getElementById("timer");


    const captureBtn =
      document.getElementById("captureBtn");


    const captureBtnWrap =
      document.getElementById("captureBtnWrap");


    const cropControls =
      document.getElementById("cropControls");


    const confirmCropBtn =
      document.getElementById("confirmCropBtn");


    const cancelCropBtn =
      document.getElementById("cancelCropBtn");


    const postControls =
      document.getElementById("postControls");


    const shuffleBtn =
      document.getElementById("shuffleBtn");


    const undoBtn =
      document.getElementById("undoBtn");


    const retakeBtn =
      document.getElementById("retakeBtn");


    /* =========================================
       SETTINGS
    ========================================= */

    const GRID = 3;

    const CROP_HOLD_MS = 5000;


    /* =========================================
       CANVAS
    ========================================= */

    let CANVAS_W = 0;

    let CANVAS_H = 0;


    function resizeCanvas() {

      CANVAS_W =
        window.innerWidth;

      CANVAS_H =
        window.innerHeight;


      canvas.width =
        CANVAS_W;

      canvas.height =
        CANVAS_H;

    }


    resizeCanvas();


    /* =========================================
       GAME STATE
    ========================================= */

    let phase = "preview";


    let tileCanvases = [];


    let order = [];


    let heldTile = null;


    let cursor = {

      x: 0,

      y: 0,

      visible: false

    };


    let prevPinching = false;


    let solvedShown = false;


    /* =========================================
       TIMER
    ========================================= */

    let moveHistory = [];


    let timerStart = 0;


    let timerInterval = null;


    /* =========================================
       CROP
    ========================================= */

    let crop = {

      x: 0,

      y: 0,

      w: 0,

      h: 0

    };


    let cropGrab = null;


    let twoHandTimerActive = false;


    let twoHandTimerStart = 0;


    /* =========================================
       HAND TRACKING STATE
    ========================================= */

    let handLandmarker = null;


    let cachedHands = [];


    let detectBusy = false;


    let frameCount = 0;


    let lastVideoTime = -1;


    let modelReady = false;


    /* =========================================
       BUBBLES 🫧
    ========================================= */

    const bubbles = [];


    function initBubbles() {

      bubbles.length = 0;


      const count =
        Math.min(
          42,
          Math.floor(
            Math.min(
              CANVAS_W,
              CANVAS_H
            ) / 18
          )
        );


      for (
        let i = 0;
        i < count;
        i++
      ) {

        bubbles.push({

          x:
            Math.random() *
            CANVAS_W,

          y:
            Math.random() *
            CANVAS_H,

          r:
            5 +
            Math.random() *
            25,

          speed:
            0.25 +
            Math.random() *
            0.8,

          wobble:
            Math.random() *
            Math.PI *
            2,

          wobbleSpeed:
            0.01 +
            Math.random() *
            0.025,

          alpha:
            0.12 +
            Math.random() *
            0.25

        });

      }

    }


    function drawBubbles() {

      for (
        const b of bubbles
      ) {

        b.y -= b.speed;

        b.wobble +=
          b.wobbleSpeed;


        const bx =
          b.x +
          Math.sin(
            b.wobble
          ) * 14;


        if (
          b.y <
          -b.r * 2
        ) {

          b.y =
            CANVAS_H +
            b.r * 2;

          b.x =
            Math.random() *
            CANVAS_W;

        }


        /*
          Bubble
        */

        ctx.beginPath();

        ctx.arc(
          bx,
          b.y,
          b.r,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          `rgba(
            255,
            255,
            255,
            ${b.alpha * 0.55}
          )`;


        ctx.fill();


        /*
          Bubble outline
        */

        ctx.strokeStyle =
          `rgba(
            255,
            255,
            255,
            ${Math.min(
              0.55,
              b.alpha * 1.4
            )}
          )`;


        ctx.lineWidth =
          1.2;


        ctx.stroke();


        /*
          Little reflection
        */

        ctx.beginPath();

        ctx.arc(
          bx - b.r * 0.3,
          b.y - b.r * 0.3,
          b.r * 0.25,
          0,
          Math.PI * 2
        );


        ctx.fillStyle =
          `rgba(
            255,
            255,
            255,
            ${Math.min(
              0.75,
              b.alpha * 1.2
            )}
          )`;


        ctx.fill();

      }

    }


    initBubbles();


    /* =========================================
       CAMERA → CANVAS TRANSFORM
    ========================================= */

    function getCoverTransform() {

      const vw =
        video.videoWidth || 640;


      const vh =
        video.videoHeight || 480;


      const scale =
        Math.max(
          CANVAS_W / vw,
          CANVAS_H / vh
        );


      const drawW =
        vw * scale;


      const drawH =
        vh * scale;


      return {

        vw,

        vh,

        scale,

        drawW,

        drawH,

        offsetX:
          (CANVAS_W -
            drawW) / 2,

        offsetY:
          (CANVAS_H -
            drawH) / 2

      };

    }


    function drawCoverVideo(
      targetCtx
    ) {

      const t =
        getCoverTransform();


      targetCtx.drawImage(

        video,

        t.offsetX,

        t.offsetY,

        t.drawW,

        t.drawH

      );

    }


    /*
      Convert MediaPipe normalized
      coordinates into canvas pixels.
    */

    function toCanvasPoint(
      landmark
    ) {

      const t =
        getCoverTransform();


      return {

        x:
          t.offsetX +
          landmark.x *
          t.vw *
          t.scale,

        y:
          t.offsetY +
          landmark.y *
          t.vh *
          t.scale

      };

    }


    function dist(a, b) {

      return Math.hypot(

        a.x - b.x,

        a.y - b.y

      );

    }


    /* =========================================
       PROCESS HAND
    ========================================= */

    function processHand(
      landmarks
    ) {

      const thumbTip =
        toCanvasPoint(
          landmarks[4]
        );


      const indexTip =
        toCanvasPoint(
          landmarks[8]
        );


      const wrist =
        toCanvasPoint(
          landmarks[0]
        );


      const middleMcp =
        toCanvasPoint(
          landmarks[9]
        );


      const handScale =
        Math.max(

          dist(
            wrist,
            middleMcp
          ),

          20

        );


      /*
        Pinch detection.

        0.60 is intentionally
        forgiving for webcams.
      */

      const pinching =
        dist(
          thumbTip,
          indexTip
        ) <
        handScale * 0.60;


      return {

        landmarks,

        thumbTip,

        indexTip,

        wrist,

        middleMcp,

        pinching,

        pinchPoint: {

          x:
            (
              thumbTip.x +
              indexTip.x
            ) / 2,

          y:
            (
              thumbTip.y +
              indexTip.y
            ) / 2

        }

      };

    }


    /* =========================================
       CROP
    ========================================= */

    function defaultCrop() {

      const size =
        Math.min(
          CANVAS_W,
          CANVAS_H
        ) * 0.82;


      crop = {

        x:
          (CANVAS_W -
            size) / 2,

        y:
          (CANVAS_H -
            size) / 2,

        w:
          size,

        h:
          size

      };

    }


    function clampCrop() {

      const min =
        Math.min(
          CANVAS_W,
          CANVAS_H
        ) * 0.18;


      if (
        crop.w < min
      )
        crop.w = min;


      if (
        crop.h < min
      )
        crop.h = min;


      if (
        crop.w >
        CANVAS_W
      )
        crop.w =
          CANVAS_W;


      if (
        crop.h >
        CANVAS_H
      )
        crop.h =
          CANVAS_H;


      if (
        crop.x < 0
      )
        crop.x = 0;


      if (
        crop.y < 0
      )
        crop.y = 0;


      if (
        crop.x +
        crop.w >
        CANVAS_W
      ) {

        crop.x =
          CANVAS_W -
          crop.w;

      }


      if (
        crop.y +
        crop.h >
        CANVAS_H
      ) {

        crop.y =
          CANVAS_H -
          crop.h;

      }

    }


    function softClampCrop() {

      if (
        crop.x < 0
      ) {

        crop.w +=
          crop.x;

        crop.x = 0;

      }


      if (
        crop.y < 0
      ) {

        crop.h +=
          crop.y;

        crop.y = 0;

      }


      if (
        crop.x +
        crop.w >
        CANVAS_W
      ) {

        crop.w =
          CANVAS_W -
          crop.x;

      }


      if (
        crop.y +
        crop.h >
        CANVAS_H
      ) {

        crop.h =
          CANVAS_H -
          crop.y;

      }


      if (
        crop.w < 10
      )
        crop.w = 10;


      if (
        crop.h < 10
      )
        crop.h = 10;

    }


    function cellRect(
      gridPos
    ) {

      const col =
        gridPos % GRID;


      const row =
        Math.floor(
          gridPos / GRID
        );


      const cw =
        crop.w / GRID;


      const ch =
        crop.h / GRID;


      return {

        x:
          crop.x +
          col * cw,

        y:
          crop.y +
          row * ch,

        w:
          cw,

        h:
          ch

      };

    }


    function gridPosAt(
      x,
      y
    ) {

      if (

        x < crop.x ||

        y < crop.y ||

        x >=
          crop.x +
          crop.w ||

        y >=
          crop.y +
          crop.h

      ) {

        return -1;

      }


      const col =
        Math.floor(

          (x - crop.x) /
          (crop.w / GRID)

        );


      const row =
        Math.floor(

          (y - crop.y) /
          (crop.h / GRID)

        );


      return (
        row * GRID +
        col
      );

    }


    /* =========================================
       CREATE PUZZLE TILES
    ========================================= */

    function sliceIntoTiles(
      sourceCanvas
    ) {

      tileCanvases = [];


      const cw =
        crop.w / GRID;


      const ch =
        crop.h / GRID;


      for (
        let i = 0;
        i < GRID * GRID;
        i++
      ) {

        const col =
          i % GRID;


        const row =
          Math.floor(
            i / GRID
          );


        const tile =
          document.createElement(
            "canvas"
          );


        tile.width =
          cw;


        tile.height =
          ch;


        const tileCtx =
          tile.getContext(
            "2d"
          );


        tileCtx.drawImage(

          sourceCanvas,

          crop.x +
            col * cw,

          crop.y +
            row * ch,

          cw,

          ch,

          0,

          0,

          cw,

          ch

        );


        tileCanvases.push(
          tile
        );

      }

    }


    /* =========================================
       SHUFFLE
    ========================================= */

    function shuffle() {

      order =
        [
          ...Array(
            GRID * GRID
          ).keys()
        ];


      do {

        for (
          let i =
            order.length - 1;

          i > 0;

          i--
        ) {

          const j =
            Math.floor(
              Math.random() *
              (i + 1)
            );


          [
            order[i],
            order[j]
          ] =
          [
            order[j],
            order[i]
          ];

        }

      }

      while (
        isSolved()
      );


      heldTile =
        null;


      solvedShown =
        false;


      moveHistory =
        [];


      updateUndoBtn();

    }


    function isSolved() {

      return order.every(
        (
          value,
          index
        ) =>
          value === index
      );

    }


    /* =========================================
       TIMER
    ========================================= */

    function startTimer() {

      stopTimer();


      timerStart =
        Date.now();


      timerEl.style.display =
        "block";


      timerInterval =
        setInterval(
          updateTimer,
          250
        );


      updateTimer();

    }


    function stopTimer() {

      if (
        timerInterval
      ) {

        clearInterval(
          timerInterval
        );


        timerInterval =
          null;

      }

    }


    function updateTimer() {

      const seconds =
        Math.floor(

          (
            Date.now() -
            timerStart
          ) / 1000

        );


      const minutes =
        String(
          Math.floor(
            seconds / 60
          )
        ).padStart(
          2,
          "0"
        );


      const secs =
        String(
          seconds % 60
        ).padStart(
          2,
          "0"
        );


      timerEl.textContent =
        `${minutes}:${secs}`;

    }


    /* =========================================
       CAPTURE PHOTO
    ========================================= */

    function capturePhoto() {

      const shot =
        document.createElement(
          "canvas"
        );


      shot.width =
        CANVAS_W;


      shot.height =
        CANVAS_H;


      const shotCtx =
        shot.getContext(
          "2d"
        );


      drawCoverVideo(
        shotCtx
      );


      sliceIntoTiles(
        shot
      );


      shuffle();


      phase =
        "puzzle";


      twoHandTimerActive =
        false;


      cropGrab =
        null;


      captureBtnWrap
        .style
        .display =
        "none";


      cropControls
        .style
        .display =
        "none";


      postControls
        .style
        .display =
        "flex";


      stage.classList.add(
        "puzzle-mode"
      );


      initBubbles();


      startTimer();


      instructions.textContent =
        "Pinch a tile and drag it onto another tile to swap.";

    }


    /* =========================================
       ENTER CROP
    ========================================= */

    function enterCropPhase() {

      phase =
        "crop";


      defaultCrop();


      twoHandTimerActive =
        false;


      cropGrab =
        null;


      captureBtnWrap
        .style
        .display =
        "none";


      cropControls
        .style
        .display =
        "flex";


      instructions.textContent =
        "Pinch a corner to resize or pinch inside the box to move it.";

    }


    /* =========================================
       BACK TO CAMERA
    ========================================= */

    function backToPreview() {

      phase =
        "preview";


      stopTimer();


      timerEl.style.display =
        "none";


      twoHandTimerActive =
        false;


      cropGrab =
        null;


      heldTile =
        null;


      cachedHands =
        [];


      captureBtnWrap
        .style
        .display =
        "flex";


      cropControls
        .style
        .display =
        "none";


      postControls
        .style
        .display =
        "none";


      stage.classList.remove(
        "puzzle-mode"
      );


      instructions.textContent =
        "Frame yourself, then capture.";

    }


    /* =========================================
       UNDO
    ========================================= */

    function updateUndoBtn() {

      undoBtn.disabled =
        moveHistory.length === 0;

    }


    function undoMove() {

      if (

        moveHistory.length === 0 ||

        phase !==
          "puzzle"

      ) {

        return;

      }


      const move =
        moveHistory.pop();


      const temp =
        order[
          move.fromPos
        ];


      order[
        move.fromPos
      ] =
        order[
          move.toPos
        ];


      order[
        move.toPos
      ] =
        temp;


      heldTile =
        null;


      solvedShown =
        isSolved();


      updateUndoBtn();


      instructions.textContent =
        "Undid last move.";

    }


    /* =========================================
       BUTTON EVENTS
    ========================================= */

    captureBtn.addEventListener(
      "click",
      enterCropPhase
    );


    confirmCropBtn.addEventListener(
      "click",
      () => {

        clampCrop();

        capturePhoto();

      }
    );


    cancelCropBtn.addEventListener(
      "click",
      backToPreview
    );


    shuffleBtn.addEventListener(
      "click",
      () => {

        shuffle();

        startTimer();

        instructions.textContent =
          "Shuffled! Solve it again.";

      }
    );


    undoBtn.addEventListener(
      "click",
      undoMove
    );


    retakeBtn.addEventListener(
      "click",
      backToPreview
    );


    /* =========================================
       HAND SKELETON
    ========================================= */

    function drawHandSkeleton(
      landmarks
    ) {

      const connections = [

        [0,1],
        [1,2],
        [2,3],
        [3,4],

        [0,5],
        [5,6],
        [6,7],
        [7,8],

        [5,9],
        [9,10],
        [10,11],
        [11,12],

        [9,13],
        [13,14],
        [14,15],
        [15,16],

        [13,17],
        [17,18],
        [18,19],
        [19,20],

        [0,17]

      ];


      ctx.strokeStyle =
        "rgba(7,89,133,0.85)";


      ctx.lineWidth =
        2;


      ctx.beginPath();


      connections.forEach(
        ([a,b]) => {

          const pa =
            toCanvasPoint(
              landmarks[a]
            );


          const pb =
            toCanvasPoint(
              landmarks[b]
            );


          ctx.moveTo(
            pa.x,
            pa.y
          );


          ctx.lineTo(
            pb.x,
            pb.y
          );

        }
      );


      ctx.stroke();


      /*
        Draw landmark dots
      */

      landmarks.forEach(
        landmark => {

          const point =
            toCanvasPoint(
              landmark
            );


          ctx.beginPath();


          ctx.arc(
            point.x,
            point.y,
            2.5,
            0,
            Math.PI * 2
          );


          ctx.fillStyle =
            "rgba(255,255,255,0.95)";


          ctx.fill();

        }
      );

    }


    /* =========================================
       CROP DRAWING
    ========================================= */

    function cropHandleRadius() {

      return Math.max(

        24,

        Math.min(
          CANVAS_W,
          CANVAS_H
        ) * 0.032

      );

    }


    function drawCropBox() {

      ctx.save();


      /*
        Dark translucent area
        outside the crop.
      */

      ctx.fillStyle =
        "rgba(7,89,133,0.22)";


      ctx.fillRect(
        0,
        0,
        CANVAS_W,
        crop.y
      );


      ctx.fillRect(

        0,

        crop.y +
          crop.h,

        CANVAS_W,

        CANVAS_H -
          (
            crop.y +
            crop.h
          )

      );


      ctx.fillRect(

        0,

        crop.y,

        crop.x,

        crop.h

      );


      ctx.fillRect(

        crop.x +
          crop.w,

        crop.y,

        CANVAS_W -
          (
            crop.x +
            crop.w
          ),

        crop.h

      );


      /*
        Crop border
      */

      ctx.strokeStyle =
        "#ffffff";


      ctx.lineWidth =
        3;


      ctx.strokeRect(

        crop.x,

        crop.y,

        crop.w,

        crop.h

      );


      /*
        Corner handles
      */

      const r =
        cropHandleRadius();


      const corners = [

        [
          crop.x,
          crop.y
        ],

        [
          crop.x +
            crop.w,
          crop.y
        ],

        [
          crop.x,
          crop.y +
            crop.h
        ],

        [
          crop.x +
            crop.w,
          crop.y +
            crop.h
        ]

      ];


      corners.forEach(
        ([cx,cy]) => {

          ctx.beginPath();


          ctx.arc(
            cx,
            cy,
            r * 0.4,
            0,
            Math.PI * 2
          );


          ctx.fillStyle =
            "#ffffff";


          ctx.fill();


          ctx.beginPath();


          ctx.arc(
            cx,
            cy,
            r,
            0,
            Math.PI * 2
          );


          ctx.strokeStyle =
            "rgba(255,255,255,0.7)";


          ctx.lineWidth =
            1.5;


          ctx.stroke();

        }
      );


      ctx.restore();

    }


    /* =========================================
       TWO HAND TIMER
    ========================================= */

    function drawTwoHandTimer() {

      if (
        !twoHandTimerActive
      )
        return;


      const elapsed =
        performance.now() -
        twoHandTimerStart;


      const remaining =
        Math.max(

          0,

          CROP_HOLD_MS -
            elapsed

        );


      const progress =
        1 -
        remaining /
          CROP_HOLD_MS;


      const cx =
        CANVAS_W / 2;


      const cy =
        Math.min(
          CANVAS_H * 0.16,
          130
        );


      const radius =
        Math.max(

          28,

          Math.min(
            CANVAS_W,
            CANVAS_H
          ) * 0.045

        );


      ctx.save();


      /*
        Circle background
      */

      ctx.beginPath();


      ctx.arc(
        cx,
        cy,
        radius,
        0,
        Math.PI * 2
      );


      ctx.fillStyle =
        "rgba(255,255,255,0.78)";


      ctx.fill();


      /*
        Progress ring
      */

      ctx.beginPath();


      ctx.arc(

        cx,

        cy,

        radius,

        -Math.PI / 2,

        -Math.PI / 2 +
          progress *
          Math.PI * 2

      );


      ctx.strokeStyle =
        "#075985";


      ctx.lineWidth =
        5;


      ctx.stroke();


      /*
        Number
      */

      ctx.fillStyle =
        "#075985";


      ctx.font =
        `bold ${
          Math.round(
            radius * 0.9
          )
        }px sans-serif`;


      ctx.textAlign =
        "center";


      ctx.textBaseline =
        "middle";


      ctx.fillText(

        Math.ceil(
          remaining / 1000
        ).toString(),

        cx,

        cy + 1

      );


      ctx.restore();

    }


    /* =========================================
       RENDER
    ========================================= */

    function render() {

      ctx.clearRect(

        0,

        0,

        CANVAS_W,

        CANVAS_H

      );


      /*
        CAMERA / CROP
      */

      if (

        phase === "preview" ||

        phase === "crop"

      ) {

        drawCoverVideo(
          ctx
        );


        if (
          phase === "crop"
        ) {

          drawCropBox();

          drawTwoHandTimer();

        }

      }


      /*
        PUZZLE
      */

      else {

        drawBubbles();


        /*
          Draw every tile
        */

        for (

          let pos = 0;

          pos <
            order.length;

          pos++

        ) {

          const tileId =
            order[pos];


          /*
            Don't draw the
            tile being held.
          */

          if (

            heldTile &&

            heldTile.tileId ===
              tileId

          ) {

            continue;

          }


          const rect =
            cellRect(pos);


          ctx.drawImage(

            tileCanvases[
              tileId
            ],

            rect.x,

            rect.y,

            rect.w,

            rect.h

          );

        }


        /*
          Puzzle grid
        */

        ctx.strokeStyle =
          "rgba(255,255,255,0.75)";


        ctx.lineWidth =
          1;


        for (

          let i = 1;

          i < GRID;

          i++

        ) {

          const gx =
            crop.x +
            (
              crop.w /
              GRID
            ) * i;


          ctx.beginPath();


          ctx.moveTo(
            gx,
            crop.y
          );


          ctx.lineTo(
            gx,
            crop.y +
              crop.h
          );


          ctx.stroke();


          const gy =
            crop.y +
            (
              crop.h /
              GRID
            ) * i;


          ctx.beginPath();


          ctx.moveTo(
            crop.x,
            gy
          );


          ctx.lineTo(
            crop.x +
              crop.w,
            gy
          );


          ctx.stroke();

        }


        /*
          Held puzzle piece
        */

        if (

          heldTile &&

          cursor.visible

        ) {

          const cw =
            crop.w / GRID;


          const ch =
            crop.h / GRID;


          const dw =
            cw * 1.08;


          const dh =
            ch * 1.08;


          ctx.save();


          ctx.shadowColor =
            "rgba(7,89,133,0.35)";


          ctx.shadowBlur =
            18;


          ctx.drawImage(

            tileCanvases[
              heldTile.tileId
            ],

            cursor.x -
              dw / 2,

            cursor.y -
              dh / 2,

            dw,

            dh

          );


          ctx.restore();

        }


        /*
          Puzzle solved
        */

        if (

          isSolved() &&

          !solvedShown

        ) {

          solvedShown =
            true;


          stopTimer();


          instructions.innerHTML =
            "🎉 Puzzle solved!";

        }


        if (
          isSolved()
        ) {

          ctx.fillStyle =
            "rgba(255,255,255,0.95)";


          ctx.font =
            `bold ${
              Math.round(
                CANVAS_W *
                0.032
              )
            }px sans-serif`;


          ctx.textAlign =
            "center";


          ctx.fillText(

            "SOLVED 🫧",

            CANVAS_W / 2,

            CANVAS_H * 0.1

          );

        }

      }


      /*
        Draw detected hands
      */

      cachedHands.forEach(
        hand => {

          drawHandSkeleton(
            hand.landmarks
          );

        }
      );


      /*
        Cursor
      */

      if (

        cursor.visible &&

        phase === "puzzle"

      ) {

        ctx.beginPath();


        ctx.arc(

          cursor.x,

          cursor.y,

          11,

          0,

          Math.PI * 2

        );


        ctx.strokeStyle =
          heldTile

            ? "#ffffff"

            : "rgba(255,255,255,0.9)";


        ctx.lineWidth =
          3;


        ctx.stroke();

      }

    }


    /* =========================================
       SINGLE HAND CROP
    ========================================= */

    function handleSingleHandCrop(
      hand
    ) {

      if (!hand) {

        prevPinching =
          false;


        cropGrab =
          null;


        cursor.visible =
          false;


        return;

      }


      const pinching =
        hand.pinching;


      cursor.x =
        hand.pinchPoint.x;


      cursor.y =
        hand.pinchPoint.y;


      cursor.visible =
        true;


      /*
        Start pinch
      */

      if (

        pinching &&

        !prevPinching

      ) {

        const radius =
          cropHandleRadius();


        const corners = {

          tl: {
            x: crop.x,
            y: crop.y
          },

          tr: {
            x:
              crop.x +
              crop.w,

            y:
              crop.y
          },

          bl: {
            x:
              crop.x,

            y:
              crop.y +
              crop.h
          },

          br: {
            x:
              crop.x +
              crop.w,

            y:
              crop.y +
              crop.h
          }

        };


        let mode =
          null;


        for (
          const key in corners
        ) {

          if (

            dist(
              cursor,
              corners[key]
            ) < radius

          ) {

            mode =
              key;

            break;

          }

        }


        /*
          Pinch inside box
          = move crop
        */

        if (

          !mode &&

          cursor.x >
            crop.x &&

          cursor.x <
            crop.x +
              crop.w &&

          cursor.y >
            crop.y &&

          cursor.y <
            crop.y +
              crop.h

        ) {

          mode =
            "move";

        }


        if (mode) {

          cropGrab = {

            mode,

            startX:
              cursor.x,

            startY:
              cursor.y,

            orig:
              {
                ...crop
              }

          };

        }

      }


      /*
        Continue pinch
      */

      else if (

        pinching &&

        prevPinching &&

        cropGrab

      ) {

        const dx =
          cursor.x -
          cropGrab.startX;


        const dy =
          cursor.y -
          cropGrab.startY;


        const original =
          cropGrab.orig;


        switch (
          cropGrab.mode
        ) {

          case "move":

            crop.x =
              original.x +
              dx;

            crop.y =
              original.y +
              dy;

            break;


          case "tl":

            crop.x =
              original.x +
              dx;

            crop.y =
              original.y +
              dy;

            crop.w =
              original.w -
              dx;

            crop.h =
              original.h -
              dy;

            break;


          case "tr":

            crop.y =
              original.y +
              dy;

            crop.w =
              original.w +
              dx;

            crop.h =
              original.h -
              dy;

            break;


          case "bl":

            crop.x =
              original.x +
              dx;

            crop.w =
              original.w -
              dx;

            crop.h =
              original.h +
              dy;

            break;


          case "br":

            crop.w =
              original.w +
              dx;

            crop.h =
              original.h +
              dy;

            break;

        }


        clampCrop();

      }


      /*
        Release pinch
      */

      else if (

        !pinching &&

        prevPinching

      ) {

        cropGrab =
          null;

      }


      prevPinching =
        pinching;

    }


    /* =========================================
       TWO HAND CROP
    ========================================= */

    function handleCropLogic(
      hands
    ) {

      const twoHandMode =

        hands.length >= 2 &&

        hands[0].pinching &&

        hands[1].pinching;


      if (twoHandMode) {

        cropGrab =
          null;


        const p1 =
          hands[0].pinchPoint;


        const p2 =
          hands[1].pinchPoint;


        crop = {

          x:
            Math.min(
              p1.x,
              p2.x
            ),

          y:
            Math.min(
              p1.y,
              p2.y
            ),

          w:
            Math.abs(
              p1.x -
              p2.x
            ),

          h:
            Math.abs(
              p1.y -
              p2.y
            )

        };


        softClampCrop();


        if (
          !twoHandTimerActive
        ) {

          twoHandTimerActive =
            true;


          twoHandTimerStart =
            performance.now();

        }


        /*
          Hold both pinches
          for 5 seconds.
        */

        if (

          performance.now() -
          twoHandTimerStart >=
          CROP_HOLD_MS

        ) {

          clampCrop();

          capturePhoto();

        }


        cursor.visible =
          false;


        return;

      }


      twoHandTimerActive =
        false;


      handleSingleHandCrop(
        hands[0] || null
      );

    }


    /* =========================================
       PUZZLE HAND LOGIC
    ========================================= */

    function handlePuzzleLogic(
      hand
    ) {

      if (!hand) {

        cursor.visible =
          false;


        prevPinching =
          false;


        return;

      }


      cursor.x =
        hand.pinchPoint.x;


      cursor.y =
        hand.pinchPoint.y;


      cursor.visible =
        true;


      const pinching =
        hand.pinching;


      /*
        Pinch down
        = pick up tile
      */

      if (

        pinching &&

        !prevPinching

      ) {

        const pos =
          gridPosAt(

            cursor.x,

            cursor.y

          );


        if (

          pos !== -1 &&

          !heldTile

        ) {

          heldTile = {

            tileId:
              order[pos],

            fromPos:
              pos

          };

        }

      }


      /*
        Release
        = drop tile
      */

      else if (

        !pinching &&

        prevPinching

      ) {

        if (heldTile) {

          const dropPos =
            gridPosAt(

              cursor.x,

              cursor.y

            );


          if (

            dropPos !== -1 &&

            dropPos !==
              heldTile.fromPos

          ) {

            const otherTile =
              order[
                dropPos
              ];


            order[
              dropPos
            ] =
              heldTile.tileId;


            order[
              heldTile.fromPos
            ] =
              otherTile;


            moveHistory.push({

              fromPos:
                heldTile.fromPos,

              toPos:
                dropPos

            });


            updateUndoBtn();

          }


          heldTile =
            null;

        }

      }


      prevPinching =
        pinching;

    }


    /* =========================================
       MEDIAPIPE
    ========================================= */

    async function initHandTracking() {

      instructions.textContent =
        "Loading hand tracking…";


      try {

        /*
          Load the WASM runtime.
        */

        const filesetResolver =

          await FilesetResolver
            .forVisionTasks(

              "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"

            );


        /*
          Create the hand detector.
        */

        handLandmarker =

          await HandLandmarker
            .createFromOptions(

              filesetResolver,

              {

                baseOptions: {

                  modelAssetPath:

                    "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task",

                  delegate:
                    "CPU"

                },


                runningMode:
                  "VIDEO",


                /*
                  Detect up to two hands.
                */

                numHands:
                  2,


                /*
                  Lower thresholds
                  make webcam detection
                  more forgiving.
                */

                minHandDetectionConfidence:
                  0.35,

                minHandPresenceConfidence:
                  0.35,

                minTrackingConfidence:
                  0.35

              }

            );


        modelReady =
          true;


        instructions.textContent =
          "✋ Hand tracking ready — pinch your thumb + index finger.";


        console.log(
          "MediaPipe loaded successfully."
        );

      }

      catch (error) {

        modelReady =
          false;


        console.error(
          "MediaPipe loading error:",
          error
        );


        instructions.textContent =
          "❌ Hand tracking failed to load. Check your internet connection and refresh.";

      }

    }


    /* =========================================
       CAMERA LOOP
    ========================================= */

    async function cameraLoop() {

      /*
        Wait for camera.
      */

      if (

        !video.videoWidth ||

        video.readyState < 2

      ) {

        requestAnimationFrame(
          cameraLoop
        );

        return;

      }


      /*
        Draw camera/puzzle.
      */

      render();


      /*
        Don't run MediaPipe
        until model is ready.
      */

      if (

        !modelReady ||

        !handLandmarker ||

        detectBusy

      ) {

        requestAnimationFrame(
          cameraLoop
        );

        return;

      }


      /*
        Detect every second
        frame instead of every
        browser frame.
      */

      if (
        frameCount++ % 2 !== 0
      ) {

        requestAnimationFrame(
          cameraLoop
        );

        return;

      }


      /*
        IMPORTANT:

        MediaPipe VIDEO mode
        requires timestamps to
        continuously increase.

        We use the actual video
        timestamp instead of
        performance.now().
      */

      const videoTime =
        video.currentTime;


      if (

        !Number.isFinite(
          videoTime
        ) ||

        videoTime <=
          lastVideoTime

      ) {

        requestAnimationFrame(
          cameraLoop
        );

        return;

      }


      lastVideoTime =
        videoTime;


      detectBusy =
        true;


      try {

        const timestampMs =
          Math.round(
            videoTime * 1000
          );


        const result =

          handLandmarker
            .detectForVideo(

              video,

              timestampMs

            );


        cachedHands =

          (
            result.landmarks ||
            []
          ).map(
            processHand
          );


        /*
          Crop
        */

        if (
          phase === "crop"
        ) {

          handleCropLogic(
            cachedHands
          );

        }


        /*
          Puzzle
        */

        else if (
          phase === "puzzle"
        ) {

          handlePuzzleLogic(
            cachedHands[0] ||
            null
          );

        }

      }

      catch (error) {

        console.error(
          "Hand detection error:",
          error
        );

      }

      finally {

        detectBusy =
          false;

      }


      requestAnimationFrame(
        cameraLoop
      );

    }


    /* =========================================
       START CAMERA
    ========================================= */

    async function startCamera() {

      try {

        instructions.textContent =
          "Starting camera…";


        /*
          Ask browser for webcam.
        */

        const stream =

          await navigator
            .mediaDevices
            .getUserMedia({

              video: {

                width: {

                  ideal: 640,

                  min: 320

                },

                height: {

                  ideal: 480,

                  min: 240

                },

                facingMode:
                  "user"

              },

              audio:
                false

            });


        /*
          Give stream to video.
        */

        video.srcObject =
          stream;


        /*
          Wait until camera
          metadata exists.
        */

        await new Promise(
          resolve => {

            if (
              video.readyState >= 1
            ) {

              resolve();

            }

            else {

              video.addEventListener(

                "loadedmetadata",

                resolve,

                {
                  once: true
                }

              );

            }

          }
        );


        /*
          Start video.
        */

        await video.play();


        console.log(
          "Camera:",
          video.videoWidth,
          "x",
          video.videoHeight
        );


        /*
          NOW load MediaPipe.
        */

        await initHandTracking();


        lastVideoTime =
          -1;


        /*
          Start rendering.
        */

        requestAnimationFrame(
          cameraLoop
        );

      }

      catch (error) {

        console.error(
          "Camera startup error:",
          error
        );


        instructions.textContent =
          "❌ Camera could not start: " +
          error.message;

      }

    }


    /* =========================================
       WINDOW RESIZE
    ========================================= */

    window.addEventListener(
      "resize",
      () => {

        const oldW =
          CANVAS_W;


        const oldH =
          CANVAS_H;


        resizeCanvas();


        if (

          phase === "crop" &&

          oldW &&

          oldH

        ) {

          crop.x *=
            CANVAS_W /
            oldW;


          crop.w *=
            CANVAS_W /
            oldW;


          crop.y *=
            CANVAS_H /
            oldH;


          crop.h *=
            CANVAS_H /
            oldH;


          clampCrop();

        }


        if (
          phase === "puzzle"
        ) {

          initBubbles();

        }

      }
    );


    /* =========================================
       START APP
    ========================================= */

    startCamera();

  </script>
