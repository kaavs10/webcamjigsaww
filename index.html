<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  />

  <title>Ocean Hand-Controlled Jigsaw</title>

  <style>
    * {
      box-sizing: border-box;
    }

    html,
    body {
      margin: 0;
      padding: 0;
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      overflow-x: hidden;
    }

    body {
      background:
        radial-gradient(circle at 20% 20%, rgba(255,255,255,0.45), transparent 25%),
        linear-gradient(180deg, #bdefff 0%, #8ddcf5 45%, #63c8eb 100%);
      color: #073b4c;
      min-height: 100vh;
    }

    /* =========================
       BUBBLES
    ========================= */

    .bubble {
      position: fixed;
      bottom: -100px;
      border-radius: 50%;
      background: rgba(255,255,255,0.35);
      border: 2px solid rgba(255,255,255,0.5);
      animation: floatBubble linear infinite;
      pointer-events: none;
      z-index: 0;
    }

    .bubble:nth-child(1) {
      width: 35px;
      height: 35px;
      left: 5%;
      animation-duration: 12s;
    }

    .bubble:nth-child(2) {
      width: 20px;
      height: 20px;
      left: 15%;
      animation-duration: 9s;
      animation-delay: 2s;
    }

    .bubble:nth-child(3) {
      width: 50px;
      height: 50px;
      left: 28%;
      animation-duration: 15s;
      animation-delay: 4s;
    }

    .bubble:nth-child(4) {
      width: 25px;
      height: 25px;
      left: 43%;
      animation-duration: 10s;
      animation-delay: 1s;
    }

    .bubble:nth-child(5) {
      width: 45px;
      height: 45px;
      left: 58%;
      animation-duration: 14s;
      animation-delay: 3s;
    }

    .bubble:nth-child(6) {
      width: 18px;
      height: 18px;
      left: 72%;
      animation-duration: 8s;
      animation-delay: 5s;
    }

    .bubble:nth-child(7) {
      width: 55px;
      height: 55px;
      left: 85%;
      animation-duration: 16s;
      animation-delay: 2s;
    }

    @keyframes floatBubble {
      0% {
        transform: translateY(0) scale(1);
        opacity: 0;
      }

      10% {
        opacity: 1;
      }

      100% {
        transform: translateY(-120vh) scale(1.15);
        opacity: 0;
      }
    }

    /* =========================
       MAIN APP
    ========================= */

    .app {
      position: relative;
      z-index: 1;
      width: 100%;
      min-height: 100vh;
      padding: 20px;
    }

    h1 {
      text-align: center;
      margin: 10px 0 4px;
      font-size: 38px;
      color: #034f64;
      text-shadow: 0 2px 0 rgba(255,255,255,0.5);
    }

    .subtitle {
      text-align: center;
      margin-bottom: 20px;
      color: #07566c;
      font-size: 16px;
    }

    .game-container {
      max-width: 1250px;
      margin: auto;
      background: rgba(255,255,255,0.45);
      border: 2px solid rgba(255,255,255,0.6);
      border-radius: 25px;
      padding: 20px;
      backdrop-filter: blur(10px);
      box-shadow: 0 15px 40px rgba(0,90,130,0.2);
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 15px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .timer {
      background: #ffffff;
      border-radius: 14px;
      padding: 12px 18px;
      font-weight: bold;
      font-size: 22px;
      color: #03506b;
      box-shadow: 0 5px 15px rgba(0,80,120,0.15);
      display: none;
    }

    .scoreboard-button {
      border: none;
      background: #ffffff;
      color: #07566c;
      padding: 12px 18px;
      border-radius: 14px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      box-shadow: 0 5px 15px rgba(0,80,120,0.15);
    }

    .scoreboard-button:hover {
      transform: translateY(-2px);
    }

    /* =========================
       CAMERA
    ========================= */

    .camera-area {
      display: flex;
      justify-content: center;
      align-items: center;
      flex-direction: column;
      gap: 15px;
    }

    video {
      width: min(850px, 100%);
      max-height: 500px;
      object-fit: cover;
      border-radius: 20px;
      background: #062b38;
      transform: scaleX(-1);
      box-shadow: 0 12px 30px rgba(0,70,100,0.3);
    }

    canvas {
      max-width: 100%;
      border-radius: 20px;
    }

    #previewCanvas {
      display: none;
      width: min(850px, 100%);
      background: white;
      box-shadow: 0 12px 30px rgba(0,70,100,0.3);
    }

    #gameCanvas {
      display: none;
      width: min(800px, 100%);
      background: white;
      box-shadow: 0 12px 30px rgba(0,70,100,0.3);
    }

    /* =========================
       BUTTONS
    ========================= */

    .buttons {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 15px;
    }

    button {
      border: none;
      border-radius: 14px;
      padding: 12px 20px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      background: #ffffff;
      color: #07566c;
      box-shadow: 0 5px 15px rgba(0,80,120,0.15);
      transition: 0.2s ease;
    }

    button:hover {
      transform: translateY(-2px);
      box-shadow: 0 8px 18px rgba(0,80,120,0.2);
    }

    button:active {
      transform: translateY(0);
    }

    .primary {
      background: #087ea4;
      color: white;
    }

    .danger {
      background: #ffffff;
      color: #c0392b;
    }

    /* =========================
       MODALS
    ========================= */

    .modal-overlay {
      position: fixed;
      inset: 0;
      background: rgba(0,45,65,0.55);
      display: none;
      justify-content: center;
      align-items: center;
      z-index: 100;
      padding: 20px;
      backdrop-filter: blur(5px);
    }

    .modal {
      width: min(450px, 100%);
      background: white;
      border-radius: 25px;
      padding: 30px;
      text-align: center;
      box-shadow: 0 20px 50px rgba(0,50,70,0.35);
    }

    .modal h2 {
      margin-top: 0;
      color: #07566c;
      font-size: 30px;
    }

    .modal p {
      color: #35616e;
      line-height: 1.5;
    }

    .modal input {
      width: 100%;
      padding: 14px;
      border-radius: 12px;
      border: 2px solid #b8e7f5;
      outline: none;
      font-size: 17px;
      margin: 12px 0;
      color: #073b4c;
    }

    .modal input:focus {
      border-color: #087ea4;
    }

    /* =========================
       SCOREBOARD
    ========================= */

    .score-list {
      text-align: left;
      margin-top: 20px;
      max-height: 350px;
      overflow-y: auto;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: #eafaff;
      border-radius: 12px;
      padding: 11px 14px;
      margin-bottom: 8px;
      color: #07566c;
      font-weight: bold;
    }

    .empty-score {
      text-align: center;
      color: #6b8993;
      padding: 20px;
    }

    /* =========================
       CROP
    ========================= */

    .crop-info {
      text-align: center;
      color: #07566c;
      font-weight: bold;
      margin-top: 10px;
      display: none;
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 700px) {
      h1 {
        font-size: 28px;
      }

      .game-container {
        padding: 12px;
      }

      .timer {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <!-- BUBBLES -->
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>
  <div class="bubble"></div>

  <div class="app">

    <h1>🌊 Ocean Jigsaw 🧩</h1>
    <div class="subtitle">
      Solve the puzzle using your hand!
    </div>

    <div class="game-container">

      <div class="top-bar">
        <div id="timer" class="timer">
          ⏱️ 01:00
        </div>

        <button
          id="scoreboardButton"
          class="scoreboard-button"
        >
          🏆 Scoreboard
        </button>
      </div>

      <div class="camera-area">

        <video
          id="video"
          autoplay
          playsinline
          muted
        ></video>

        <canvas
          id="previewCanvas"
          width="900"
          height="600"
        ></canvas>

        <canvas
          id="gameCanvas"
          width="720"
          height="720"
        ></canvas>

        <div
          id="cropInfo"
          class="crop-info"
        >
          Drag the corners to crop your image.
        </div>

        <div class="buttons">

          <button
            id="captureBtn"
            class="primary"
          >
            📸 Capture
          </button>

          <button
            id="startPuzzleBtn"
            class="primary"
            style="display:none;"
          >
            🧩 Start Puzzle
          </button>

          <button
            id="retakeBtn"
            style="display:none;"
          >
            🔄 Retake
          </button>

          <button
            id="undoBtn"
            style="display:none;"
          >
            ↩️ Undo
          </button>

          <button
            id="shuffleBtn"
            style="display:none;"
          >
            🔀 Shuffle
          </button>

        </div>

      </div>

    </div>
  </div>

  <!-- =========================
       NAME MODAL
  ========================= -->

  <div
    id="nameModal"
    class="modal-overlay"
  >
    <div class="modal">

      <h2>🌊 Welcome!</h2>

      <p>
        Enter your name to start the jigsaw puzzle.
      </p>

      <input
        id="playerName"
        type="text"
        maxlength="30"
        placeholder="Enter your name"
      />

      <button
        id="startGameBtn"
        class="primary"
      >
        Start Game 🚀
      </button>

    </div>
  </div>

  <!-- =========================
       RESULT MODAL
  ========================= -->

  <div
    id="resultModal"
    class="modal-overlay"
  >
    <div class="modal">

      <div
        id="resultIcon"
        style="font-size:60px;"
      >
        🎉
      </div>

      <h2 id="resultTitle">
        yay you get a prize
      </h2>

      <p id="resultDetails"></p>

    </div>
  </div>

  <!-- =========================
       SCOREBOARD MODAL
  ========================= -->

  <div
    id="scoreboardModal"
    class="modal-overlay"
  >
    <div class="modal">

      <h2>🏆 Scoreboard</h2>

      <div
        id="scoreList"
        class="score-list"
      ></div>

      <button id="closeScoreboardBtn">
        Close
      </button>

    </div>
  </div>


  <script type="module">

    /* ============================================================
       MEDIAPIPE
    ============================================================ */

    import {
      HandLandmarker,
      FilesetResolver
    }
    from "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/+esm";


    /* ============================================================
       ELEMENTS
    ============================================================ */

    const video =
      document.getElementById("video");

    const previewCanvas =
      document.getElementById("previewCanvas");

    const gameCanvas =
      document.getElementById("gameCanvas");

    const previewCtx =
      previewCanvas.getContext("2d");

    const gameCtx =
      gameCanvas.getContext("2d");

    const captureBtn =
      document.getElementById("captureBtn");

    const startPuzzleBtn =
      document.getElementById("startPuzzleBtn");

    const retakeBtn =
      document.getElementById("retakeBtn");

    const undoBtn =
      document.getElementById("undoBtn");

    const shuffleBtn =
      document.getElementById("shuffleBtn");

    const cropInfo =
      document.getElementById("cropInfo");

    const timerEl =
      document.getElementById("timer");

    const nameModal =
      document.getElementById("nameModal");

    const playerName =
      document.getElementById("playerName");

    const startGameBtn =
      document.getElementById("startGameBtn");

    const resultModal =
      document.getElementById("resultModal");

    const resultIcon =
      document.getElementById("resultIcon");

    const resultTitle =
      document.getElementById("resultTitle");

    const resultDetails =
      document.getElementById("resultDetails");

    const scoreboardButton =
      document.getElementById("scoreboardButton");

    const scoreboardModal =
      document.getElementById("scoreboardModal");

    const closeScoreboardBtn =
      document.getElementById("closeScoreboardBtn");

    const scoreList =
      document.getElementById("scoreList");


    /* ============================================================
       CONSTANTS
    ============================================================ */

    const ROUND_TIME_MS = 60 * 1000;

    const SCORE_KEY =
      "oceanJigsawScores";

    const GRID_SIZE = 3;

    const GAME_SIZE = 720;

    const PIECE_SIZE =
      GAME_SIZE / GRID_SIZE;


    /* ============================================================
       STATE
    ============================================================ */

    let stream = null;

    let handLandmarker = null;

    let lastVideoTime = -1;

    let currentPhase = "preview";

    let player = "";

    let roundStarted = false;

    let roundStartTime = 0;

    let timerInterval = null;

    let resultShown = false;

    let puzzlePieces = [];

    let selectedPiece = null;

    let dragOffsetX = 0;

    let dragOffsetY = 0;

    let undoStack = [];

    let capturedImage = null;

    let cropRect = {
      x: 100,
      y: 100,
      w: 700,
      h: 400
    };


    /* ============================================================
       START CAMERA
    ============================================================ */

    async function startCamera() {

      try {

        stream =
          await navigator.mediaDevices.getUserMedia({
            video: {
              facingMode: "user"
            },
            audio: false
          });

        video.srcObject = stream;

        await video.play();

      } catch (error) {

        console.error(error);

        alert(
          "Camera access is required to play the game."
        );

      }
    }


    /* ============================================================
       MEDIAPIPE SETUP
    ============================================================ */

    async function setupHandTracking() {

      const vision =
        await FilesetResolver.forVisionTasks(
          "https://cdn.jsdelivr.net/npm/@mediapipe/tasks-vision@0.10.14/wasm"
        );

      handLandmarker =
        await HandLandmarker.createFromOptions(
          vision,
          {
            baseOptions: {
              modelAssetPath:
                "https://storage.googleapis.com/mediapipe-models/hand_landmarker/hand_landmarker/float16/1/hand_landmarker.task"
            },

            runningMode: "VIDEO",

            numHands: 1
          }
        );

      requestAnimationFrame(
        detectHands
      );
    }


    /* ============================================================
       HAND DETECTION
    ============================================================ */

    async function detectHands() {

      if (
        handLandmarker &&
        video.readyState >= 2 &&
        currentPhase === "puzzle"
      ) {

        if (
          video.currentTime !==
          lastVideoTime
        ) {

          lastVideoTime =
            video.currentTime;

          const results =
            handLandmarker.detectForVideo(
              video,
              performance.now()
            );

          if (
            results.landmarks &&
            results.landmarks.length > 0
          ) {

            const landmarks =
              results.landmarks[0];

            const indexFinger =
              landmarks[8];

            /*
              IMPORTANT:

              Webcam is mirrored horizontally.

              Therefore:
                original x = x
                mirrored x = 1 - x

              This makes hand movement match
              what the player sees.
            */

            const handX =
              (1 - indexFinger.x) *
              gameCanvas.width;

            const handY =
              indexFinger.y *
              gameCanvas.height;

            handleHandMovement(
              handX,
              handY
            );
          }
        }
      }

      requestAnimationFrame(
        detectHands
      );
    }


    /* ============================================================
       HANDLE HAND MOVEMENT
    ============================================================ */

    function handleHandMovement(
      x,
      y
    ) {

      if (
        !selectedPiece ||
        !roundStarted
      ) {
        return;
      }

      selectedPiece.x =
        x - dragOffsetX;

      selectedPiece.y =
        y - dragOffsetY;

      drawPuzzle();
    }


    /* ============================================================
       CAPTURE CAMERA IMAGE
    ============================================================ */

    captureBtn.addEventListener(
      "click",
      () => {

        const width =
          video.videoWidth;

        const height =
          video.videoHeight;

        if (!width || !height) {
          return;
        }

        previewCanvas.width =
          width;

        previewCanvas.height =
          height;

        /*
          Mirror the captured image
          so it matches the webcam view.
        */

        previewCtx.save();

        previewCtx.translate(
          width,
          0
        );

        previewCtx.scale(
          -1,
          1
        );

        previewCtx.drawImage(
          video,
          0,
          0,
          width,
          height
        );

        previewCtx.restore();

        capturedImage =
          new Image();

        capturedImage.src =
          previewCanvas.toDataURL(
            "image/png"
          );

        video.style.display =
          "none";

        previewCanvas.style.display =
          "block";

        captureBtn.style.display =
          "none";

        startPuzzleBtn.style.display =
          "inline-block";

        retakeBtn.style.display =
          "inline-block";

      }
    );


    /* ============================================================
       RETAKE
    ============================================================ */

    retakeBtn.addEventListener(
      "click",
      () => {

        currentPhase =
          "preview";

        capturedImage =
          null;

        video.style.display =
          "block";

        previewCanvas.style.display =
          "none";

        gameCanvas.style.display =
          "none";

        captureBtn.style.display =
          "inline-block";

        startPuzzleBtn.style.display =
          "none";

        retakeBtn.style.display =
          "none";

        undoBtn.style.display =
          "none";

        shuffleBtn.style.display =
          "none";

        cropInfo.style.display =
          "none";

        stopTimer();

        timerEl.style.display =
          "none";
      }
    );


    /* ============================================================
       START GAME FROM NAME
    ============================================================ */

    startGameBtn.addEventListener(
      "click",
      () => {

        const enteredName =
          playerName.value.trim();

        if (!enteredName) {

          playerName.focus();

          return;
        }

        player =
          enteredName;

        nameModal.style.display =
          "none";

        resetToCameraScreen();
      }
    );


    /* ENTER KEY */
    playerName.addEventListener(
      "keydown",
      (event) => {

        if (
          event.key === "Enter"
        ) {

          startGameBtn.click();
        }
      }
    );


    /* ============================================================
       RESET TO CAMERA SCREEN
    ============================================================ */

    function resetToCameraScreen() {

      currentPhase =
        "preview";

      roundStarted =
        false;

      resultShown =
        false;

      selectedPiece =
        null;

      puzzlePieces =
        [];

      undoStack =
        [];

      capturedImage =
        null;

      stopTimer();

      timerEl.style.display =
        "none";

      video.style.display =
        "block";

      previewCanvas.style.display =
        "none";

      gameCanvas.style.display =
        "none";

      captureBtn.style.display =
        "inline-block";

      startPuzzleBtn.style.display =
        "none";

      retakeBtn.style.display =
        "none";

      undoBtn.style.display =
        "none";

      shuffleBtn.style.display =
        "none";

      cropInfo.style.display =
        "none";
    }


    /* ============================================================
       RETURN TO NAME SCREEN
    ============================================================ */

    function returnToNameScreen() {

      currentPhase =
        "preview";

      roundStarted =
        false;

      resultShown =
        false;

      stopTimer();

      timerEl.style.display =
        "none";

      video.style.display =
        "block";

      previewCanvas.style.display =
        "none";

      gameCanvas.style.display =
        "none";

      captureBtn.style.display =
        "inline-block";

      startPuzzleBtn.style.display =
        "none";

      retakeBtn.style.display =
        "none";

      undoBtn.style.display =
        "none";

      shuffleBtn.style.display =
        "none";

      cropInfo.style.display =
        "none";

      selectedPiece =
        null;

      puzzlePieces =
        [];

      undoStack =
        [];

      playerName.value =
        "";

      /*
        Small delay prevents the name popup
        from appearing at the exact same
        frame as the previous result popup.
      */

      setTimeout(
        () => {

          nameModal.style.display =
            "flex";

          playerName.focus();

        },
        150
      );
    }


    /* ============================================================
       START PUZZLE
    ============================================================ */

    startPuzzleBtn.addEventListener(
      "click",
      () => {

        if (!capturedImage) {
          return;
        }

        capturedImage.onload =
          () => {

            createPuzzle();

          };

        /*
          In case image already loaded.
        */

        if (
          capturedImage.complete
        ) {

          createPuzzle();
        }
      }
    );


    /* ============================================================
       CREATE PUZZLE
    ============================================================ */

    function createPuzzle() {

      currentPhase =
        "puzzle";

      video.style.display =
        "none";

      previewCanvas.style.display =
        "none";

      gameCanvas.style.display =
        "block";

      captureBtn.style.display =
        "none";

      startPuzzleBtn.style.display =
        "none";

      retakeBtn.style.display =
        "none";

      undoBtn.style.display =
        "inline-block";

      shuffleBtn.style.display =
        "inline-block";

      timerEl.style.display =
        "block";

      cropInfo.style.display =
        "none";

      puzzlePieces =
        [];

      undoStack =
        [];

      selectedPiece =
        null;

      resultShown =
        false;

      /*
        Create 9 pieces.
      */

      for (
        let row = 0;
        row < GRID_SIZE;
        row++
      ) {

        for (
          let col = 0;
          col < GRID_SIZE;
          col++
        ) {

          puzzlePieces.push({

            id:
              row * GRID_SIZE + col,

            correctRow:
              row,

            correctCol:
              col,

            x:
              col * PIECE_SIZE,

            y:
              row * PIECE_SIZE,

            originalX:
              col * PIECE_SIZE,

            originalY:
              row * PIECE_SIZE,

            width:
              PIECE_SIZE,

            height:
              PIECE_SIZE
          });
        }
      }

      shufflePieces();

      drawPuzzle();

      startTimer();
    }


    /* ============================================================
       SHUFFLE
    ============================================================ */

    shuffleBtn.addEventListener(
      "click",
      () => {

        if (!roundStarted) {
          return;
        }

        saveUndoState();

        shufflePieces();

        drawPuzzle();
      }
    );


    function shufflePieces() {

      /*
        Randomly place all pieces.
      */

      const positions = [];

      for (
        let row = 0;
        row < GRID_SIZE;
        row++
      ) {

        for (
          let col = 0;
          col < GRID_SIZE;
          col++
        ) {

          positions.push({
            x:
              col * PIECE_SIZE,

            y:
              row * PIECE_SIZE
          });
        }
      }

      /*
        Fisher-Yates shuffle
      */

      for (
        let i = positions.length - 1;
        i > 0;
        i--
      ) {

        const j =
          Math.floor(
            Math.random() * (i + 1)
          );

        [
          positions[i],
          positions[j]
        ] =
        [
          positions[j],
          positions[i]
        ];
      }

      puzzlePieces.forEach(
        (piece, index) => {

          piece.x =
            positions[index].x;

          piece.y =
            positions[index].y;

        }
      );
    }


    /* ============================================================
       DRAW PUZZLE
    ============================================================ */

    function drawPuzzle() {

      if (
        !capturedImage ||
        currentPhase !== "puzzle"
      ) {
        return;
      }

      gameCtx.clearRect(
        0,
        0,
        GAME_SIZE,
        GAME_SIZE
      );

      /*
        Draw pieces.
      */

      puzzlePieces.forEach(
        piece => {

          const sx =
            piece.correctCol *
            (capturedImage.width /
              GRID_SIZE);

          const sy =
            piece.correctRow *
            (capturedImage.height /
              GRID_SIZE);

          const sw =
            capturedImage.width /
            GRID_SIZE;

          const sh =
            capturedImage.height /
            GRID_SIZE;

          gameCtx.save();

          gameCtx.beginPath();

          gameCtx.rect(
            piece.x,
            piece.y,
            PIECE_SIZE,
            PIECE_SIZE
          );

          gameCtx.clip();

          gameCtx.drawImage(
            capturedImage,
            sx,
            sy,
            sw,
            sh,
            piece.x,
            piece.y,
            PIECE_SIZE,
            PIECE_SIZE
          );

          gameCtx.restore();

          /*
            Piece border
          */

          gameCtx.strokeStyle =
            "rgba(0,80,110,0.45)";

          gameCtx.lineWidth =
            2;

          gameCtx.strokeRect(
            piece.x,
            piece.y,
            PIECE_SIZE,
            PIECE_SIZE
          );

        }
      );

      /*
        Highlight selected piece.
      */

      if (selectedPiece) {

        gameCtx.strokeStyle =
          "#ffffff";

        gameCtx.lineWidth =
          5;

        gameCtx.strokeRect(
          selectedPiece.x,
          selectedPiece.y,
          PIECE_SIZE,
          PIECE_SIZE
        );
      }
    }


    /* ============================================================
       MOUSE / TOUCH SUPPORT
       HAND CONTROL IS PRIMARY
    ============================================================ */

    gameCanvas.addEventListener(
      "pointerdown",
      event => {

        if (
          !roundStarted ||
          currentPhase !== "puzzle"
        ) {
          return;
        }

        const rect =
          gameCanvas.getBoundingClientRect();

        const x =
          (event.clientX - rect.left) *
          (gameCanvas.width /
            rect.width);

        const y =
          (event.clientY - rect.top) *
          (gameCanvas.height /
            rect.height);

        for (
          let i =
            puzzlePieces.length - 1;
          i >= 0;
          i--
        ) {

          const piece =
            puzzlePieces[i];

          if (
            x >= piece.x &&
            x <= piece.x + piece.width &&
            y >= piece.y &&
            y <= piece.y + piece.height
          ) {

            saveUndoState();

            selectedPiece =
              piece;

            dragOffsetX =
              x - piece.x;

            dragOffsetY =
              y - piece.y;

            break;
          }
        }

        drawPuzzle();
      }
    );


    gameCanvas.addEventListener(
      "pointermove",
      event => {

        if (!selectedPiece) {
          return;
        }

        const rect =
          gameCanvas.getBoundingClientRect();

        const x =
          (event.clientX - rect.left) *
          (gameCanvas.width /
            rect.width);

        const y =
          (event.clientY - rect.top) *
          (gameCanvas.height /
            rect.height);

        selectedPiece.x =
          x - dragOffsetX;

        selectedPiece.y =
          y - dragOffsetY;

        drawPuzzle();
      }
    );


    gameCanvas.addEventListener(
      "pointerup",
      () => {

        if (!selectedPiece) {
          return;
        }

        snapPieceIfNeeded(
          selectedPiece
        );

        selectedPiece =
          null;

        drawPuzzle();

        checkWin();

      }
    );


    gameCanvas.addEventListener(
      "pointerleave",
      () => {

        if (!selectedPiece) {
          return;
        }

        snapPieceIfNeeded(
          selectedPiece
        );

        selectedPiece =
          null;

        drawPuzzle();

        checkWin();

      }
    );


    /* ============================================================
       SNAP PIECE
    ============================================================ */

    function snapPieceIfNeeded(
      piece
    ) {

      const correctX =
        piece.correctCol *
        PIECE_SIZE;

      const correctY =
        piece.correctRow *
        PIECE_SIZE;

      const distance =
        Math.hypot(
          piece.x - correctX,
          piece.y - correctY
        );

      /*
        Snap when close enough.
      */

      if (
        distance <
        PIECE_SIZE * 0.35
      ) {

        piece.x =
          correctX;

        piece.y =
          correctY;
      }

      /*
        Keep piece inside board.
      */

      piece.x =
        Math.max(
          0,
          Math.min(
            GAME_SIZE - PIECE_SIZE,
            piece.x
          )
        );

      piece.y =
        Math.max(
          0,
          Math.min(
            GAME_SIZE - PIECE_SIZE,
            piece.y
          )
        );
    }


    /* ============================================================
       CHECK WIN
    ============================================================ */

    function checkWin() {

      if (
        !roundStarted ||
        resultShown
      ) {
        return;
      }

      const won =
        puzzlePieces.every(
          piece =>
            Math.abs(
              piece.x -
              piece.originalX
            ) < 1 &&
            Math.abs(
              piece.y -
              piece.originalY
            ) < 1
        );

      if (won) {

        roundStarted =
          false;

        stopTimer();

        /*
          Wait 2 seconds after completing
          the puzzle before showing prize.
        */

        setTimeout(
          () => {

            showWin();

          },
          2000
        );
      }
    }


    /* ============================================================
       SHOW WIN
    ============================================================ */

    function showWin() {

      if (resultShown) {
        return;
      }

      resultShown =
        true;

      resultIcon.textContent =
        "🎉";

      resultTitle.textContent =
        "yay you get a prize";

      const elapsed =
        Date.now() -
        roundStartTime;

      const seconds =
        Math.max(
          1,
          Math.floor(
            elapsed / 1000
          )
        );

      resultDetails.textContent =
        `Well done, ${player}! You completed the puzzle in ${seconds} seconds.`;

      saveScore(
        player,
        seconds
      );

      resultModal.style.display =
        "flex";

      /*
        Keep prize popup for 3 seconds,
        then return to name screen.
      */

      setTimeout(
        () => {

          resultModal.style.display =
            "none";

          returnToNameScreen();

        },
        3000
      );
    }


    /* ============================================================
       SHOW LOSS
    ============================================================ */

    function showLoss() {

      if (resultShown) {
        return;
      }

      resultShown =
        true;

      roundStarted =
        false;

      stopTimer();

      timerEl.style.display =
        "none";

      resultIcon.textContent =
        "😭";

      resultTitle.textContent =
        "oh no better luck next time!";

      resultDetails.textContent =
        "The 1 minute time limit is over.";

      resultModal.style.display =
        "flex";

      /*
        IMPORTANT:
        After losing, go back to the
        ENTER YOUR NAME screen.
      */

      setTimeout(
        () => {

          resultModal.style.display =
            "none";

          returnToNameScreen();

        },
        3000
      );
    }


    /* ============================================================
       TIMER
    ============================================================ */

    function startTimer() {

      stopTimer();

      roundStarted =
        true;

      roundStartTime =
        Date.now();

      updateTimer();

      timerInterval =
        setInterval(
          updateTimer,
          100
        );
    }


    function updateTimer() {

      if (!roundStarted) {
        return;
      }

      const elapsed =
        Date.now() -
        roundStartTime;

      const remaining =
        Math.max(
          0,
          ROUND_TIME_MS -
          elapsed
        );

      const seconds =
        Math.ceil(
          remaining / 1000
        );

      const minutes =
        Math.floor(
          seconds / 60
        );

      const secs =
        seconds % 60;

      timerEl.textContent =
        `⏱️ ${String(minutes).padStart(2,"0")}:${String(secs).padStart(2,"0")}`;

      if (
        remaining <= 0
      ) {

        stopTimer();

        showLoss();
      }
    }


    function stopTimer() {

      if (timerInterval) {

        clearInterval(
          timerInterval
        );

        timerInterval =
          null;
      }
    }


    /* ============================================================
       UNDO
    ============================================================ */

    undoBtn.addEventListener(
      "click",
      () => {

        if (
          !roundStarted ||
          undoStack.length === 0
        ) {
          return;
        }

        const previous =
          undoStack.pop();

        puzzlePieces =
          previous.map(
            piece => ({
              ...piece
            })
          );

        selectedPiece =
          null;

        drawPuzzle();
      }
    );


    function saveUndoState() {

      undoStack.push(
        puzzlePieces.map(
          piece => ({
            ...piece
          })
        )
      );

      /*
        Keep memory reasonable.
      */

      if (
        undoStack.length > 30
      ) {

        undoStack.shift();
      }
    }


    /* ============================================================
       SCOREBOARD
    ============================================================ */

    function getScores() {

      try {

        const saved =
          localStorage.getItem(
            SCORE_KEY
          );

        if (!saved) {
          return [];
        }

        return JSON.parse(
          saved
        );

      } catch {

        return [];
      }
    }


    function saveScore(
      name,
      seconds
    ) {

      const scores =
        getScores();

      scores.push({
        name:
          name,

        time:
          seconds,

        date:
          new Date().toLocaleString()
      });

      /*
        Fastest times first.
      */

      scores.sort(
        (a, b) =>
          a.time - b.time
      );

      /*
        Keep top 10.
      */

      const topScores =
        scores.slice(
          0,
          10
        );

      try {

        localStorage.setItem(
          SCORE_KEY,
          JSON.stringify(
            topScores
          )
        );

      } catch (error) {

        console.error(
          "Could not save scoreboard:",
          error
        );
      }

      renderScoreboard();
    }


    function renderScoreboard() {

      const scores =
        getScores();

      scoreList.innerHTML =
        "";

      if (
        scores.length === 0
      ) {

        scoreList.innerHTML =
          `<div class="empty-score">
             No scores yet. Be the first! 🌊
           </div>`;

        return;
      }

      scores.forEach(
        (score, index) => {

          const row =
            document.createElement(
              "div"
            );

          row.className =
            "score-row";

          row.innerHTML =
            `
              <span>
                ${index + 1}. ${escapeHtml(score.name)}
              </span>

              <span>
                ⏱️ ${score.time}s
              </span>
            `;

          scoreList.appendChild(
            row
          );
        }
      );
    }


    function escapeHtml(
      value
    ) {

      return String(value)
        .replace(
          /&/g,
          "&amp;"
        )
        .replace(
          /</g,
          "&lt;"
        )
        .replace(
          />/g,
          "&gt;"
        )
        .replace(
          /"/g,
          "&quot;"
        )
        .replace(
          /'/g,
          "&#039;"
        );
    }


    /* ============================================================
       SCOREBOARD BUTTON
    ============================================================ */

    scoreboardButton.addEventListener(
      "click",
      () => {

        renderScoreboard();

        scoreboardModal.style.display =
          "flex";
      }
    );


    closeScoreboardBtn.addEventListener(
      "click",
      () => {

        scoreboardModal.style.display =
          "none";
      }
    );


    scoreboardModal.addEventListener(
      "click",
      event => {

        if (
          event.target ===
          scoreboardModal
        ) {

          scoreboardModal.style.display =
            "none";
        }
      }
    );


    /* ============================================================
       INITIALIZE
    ============================================================ */

    async function initialize() {

      renderScoreboard();

      await startCamera();

      try {

        await setupHandTracking();

      } catch (error) {

        console.error(
          "Hand tracking could not be loaded:",
          error
        );

        alert(
          "Hand tracking could not be loaded. Please check your internet connection and refresh the page."
        );
      }

      /*
        First screen is ALWAYS
        Enter Your Name.
      */

      nameModal.style.display =
        "flex";

      playerName.focus();
    }


    initialize();

  </script>
